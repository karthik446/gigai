[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gigai"
version = "0.1.9.dev0"
description = "Contract-first foundations for a local, user-controlled agent runtime"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "click>=8.1",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "openpyxl>=3.1",
  "pycountry>=24",
  "python-dotenv>=1.0",
  "questionary>=2.1.1",
  "referencing>=0.36",
]

[project.scripts]
gigai = "gigai.cli:cli"

[project.optional-dependencies]
test = [
  "pydantic>=2.10",
  "pytest>=8.3",
  "pytest-xdist>=3.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gigai.schemas" = ["*.schema.json", "README.md", "SHA256SUMS"]
"gigai.data" = ["*.json", "runtime-comparison-pack-v1.json"]
"gigai.scout" = ["data/*.md", "data/goalgraphs/*.md", "data/ui/*.html", "data/ui/*.css", "data/tools/*/*.json", "ui/dist/*", "ui/dist/assets/*"]
"gigai" = ["static/*.css"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers -p no:cacheprovider"
markers = [
  "g30_live: opt-in local provider UAT; skipped unless GIGAI_G30_UAT=1",
  "fast_unit: isolated deterministic unit/contract test with no filesystem, process, network, or mutable-workpad fixture",
  "integration: test requiring disposable filesystem, persistence, CLI, subprocess, concurrency, or authority-boundary setup",
  "release: test exercising installed/package/resource or release-boundary behavior",
  "cli: test that exercises a public GigAI command or CLI wrapper; selected separately from library integration",
  "installed: test or verifier that requires a normally installed GigAI package or console script",
  "scout_acquisition: behavior grouping for public Scout acquisition, discovery, and progress semantics",
]
testpaths = [
  "tests",
]
