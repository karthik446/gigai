[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gigai"
version = "0.1.5"
description = "Contract-first foundations for a local, user-controlled agent runtime"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "click>=8.1",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "referencing>=0.36",
]

[project.scripts]
gigai = "gigai.cli:cli"

[project.optional-dependencies]
test = [
  "pydantic>=2.10",
  "pytest>=8.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gigai.schemas" = ["*.schema.json", "README.md", "SHA256SUMS"]
"gigai.data" = ["*.json"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers -p no:cacheprovider"
testpaths = [
  "tests",
  "research/contract_spike/tests",
  "research/phase0_spike/tests",
]
