name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-tests:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --extra test --python "${{ matrix.python }}"
      - run: uv run --locked pytest

  wheel:
    name: Built-wheel resources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv build
      - run: uv venv --python 3.11 .wheel-venv
      - run: uv pip install --python .wheel-venv/bin/python dist/gigai-0.0.0-py3-none-any.whl
      - run: .wheel-venv/bin/python tools/verify_installed_schemas.py
      - run: .wheel-venv/bin/python tools/verify_installed_canonical.py
      - run: .wheel-venv/bin/python tools/verify_installed_cli.py
      - run: uv run --locked --extra test pytest tests/test_cli_and_scenario_harness.py -k installed_help_and_version
        env:
          GIGAI_TEST_EXECUTABLE: ${{ github.workspace }}/.wheel-venv/bin/gigai
