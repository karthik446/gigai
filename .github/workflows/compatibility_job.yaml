name: Compatibility job (sweep)

# 0.1.11.1: the PR and the release pre-check run a cut-down lane; everything else is here, non-blocking:
# nightly on main, after each release (release.yml, post-release-compatibility) and on demand. A failed row
# in the run summary is a weakness to triage, not a release failure.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Full compatibility matrix
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/pull_request.yaml
    with:
      profile: full
