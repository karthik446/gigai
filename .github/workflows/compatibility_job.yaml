name: Compatibility job (sweep)

# ci-spike: no nightly schedule. The sweep runs after each release
# (release.yml, post-release-compatibility) and on demand from here.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Full compatibility matrix
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/pull_request.yaml
    with:
      profile: full
