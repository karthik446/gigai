name: Docs

# Public docs site (gigai-docs/, Astro Starlight) on GitHub Pages, one folder per version:
#   https://karthik446.github.io/gigai/<version>/   + latest/ (newest release) + next/ (the
#   active version branch) + dev/ (main)
#
# pull_request      build + generated-reference freshness + boundary + link check; site as an
#                   artifact. Never deploys.
# push to a karthik446/gigai-v* branch   publish "next"
# push to main      publish "dev"
# workflow_call     publish a release tag with alias "latest" (called by release.yml after the release)
# workflow_dispatch publish/re-publish any ref (backfill, or after changing the domain)
#
# NOTHING IS DEPLOYED until the operator enables it (0110-011 D4). The publish job is skipped
# unless the repository variable DOCS_PUBLISH is "true" (Settings > Secrets and variables >
# Actions > Variables). To enable, in this order:
#   1. create the empty gh-pages branch:
#        git switch --orphan gh-pages && git commit --allow-empty -m gh-pages && git push origin gh-pages
#   2. Settings > Pages > Deploy from a branch > gh-pages / (root)
#   3. set the variable:  gh variable set DOCS_PUBLISH --body true
# Unset or change it to anything else to stop publishing. The build job (checks + artifact)
# always runs. No secrets are used; the publish job pushes with the workflow's own token.

on:
  pull_request:
  push:
    branches: [main, 'karthik446/gigai-v*']
  workflow_call:
    inputs:
      version: { required: true, type: string }
      ref: { required: true, type: string }
      alias: { required: false, type: string, default: latest }
  workflow_dispatch:
    inputs:
      version: { description: "Docs version folder, e.g. 0.1.10 (or dev)", required: true, type: string }
      ref: { description: "Tag/branch/SHA to build, e.g. v0.1.10", required: true, type: string }
      alias: { description: "Alias to point here (latest, or empty)", required: false, type: string, default: "" }

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  PAGES_PATH: /gigai   # the repo name on github.io; "" once a custom domain is set (then backfill)

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - id: v
        env:
          IN_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "${IN_VERSION}" ]; then v="${IN_VERSION}"
          elif [ "${GITHUB_EVENT_NAME}" = push ] && [ "${GITHUB_REF_NAME}" = main ]; then v=dev
          elif [ "${GITHUB_EVENT_NAME}" = push ]; then v=next
          else v="pr-${{ github.event.pull_request.number }}"; fi
          case "$v" in *[!A-Za-z0-9._-]*) echo "bad version $v" >&2; exit 1;; esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Generated reference pages are up to date (CLI, API, changelog) and core never links into a Gig
        run: uv run --locked python tools/docs_gen.py --check
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gigai-docs/package-lock.json
      - run: npm ci
        working-directory: gigai-docs
      - name: Build (includes the offline link check)
        working-directory: gigai-docs
        env:
          DOCS_VERSION: ${{ steps.v.outputs.version }}
          DOCS_BASE: ${{ env.PAGES_PATH }}/${{ steps.v.outputs.version }}/
        run: npm run build
      - name: User-facing code changed without a docs or CHANGELOG change (warning only)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only "${BASE_SHA}" HEAD)"
          if echo "$changed" | grep -qE '^src/gigai/.*\.(py|ts|tsx)$' \
             && ! echo "$changed" | grep -qE '^(gigai-docs/|CHANGELOG\.md$|README\.md$)'; then
            echo "::warning::src/ changed but gigai-docs/, CHANGELOG.md and README.md did not; add docs or say 'no user-facing change' in the PR"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site-${{ steps.v.outputs.version }}
          path: gigai-docs/dist
          retention-days: 7

  publish:
    name: Publish ${{ needs.build.outputs.version }} to gh-pages
    needs: build
    # Off until the operator creates gh-pages and sets DOCS_PUBLISH=true (see the header).
    if: github.event_name != 'pull_request' && vars.DOCS_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: docs-gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          path: src
      # One-time setup before the first publish (an empty gh-pages branch):
      #   git switch --orphan gh-pages && git commit --allow-empty -m gh-pages && git push origin gh-pages
      - uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: docs-site-${{ needs.build.outputs.version }}
          path: dist
      - name: File the version, move the alias, update versions.json
        env:
          VERSION: ${{ needs.build.outputs.version }}
          ALIAS: ${{ inputs.alias }}   # empty on a push (dev / next)
        run: |
          touch site/.nojekyll
          args=(--site site --dist dist --version "${VERSION}")
          if [ "${VERSION}" = dev ]; then args+=(--title "dev (main)"); fi
          if [ "${VERSION}" = next ]; then args+=(--title "next (${GITHUB_REF_NAME})"); fi
          if [ -n "${ALIAS}" ]; then args+=(--alias "${ALIAS}"); fi
          node src/gigai-docs/scripts/publish-version.mjs "${args[@]}"
          node src/gigai-docs/scripts/check-links.mjs site --base "${PAGES_PATH}/"
      - name: Push gh-pages
        working-directory: site
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -qm "docs: publish ${VERSION} from ${GITHUB_SHA}"
          git push origin HEAD:gh-pages
