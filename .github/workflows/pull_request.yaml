name: Pull request

# The profile shows in the run title, so release.yml can find the green
# pre-check run on the commit it releases with `gh api .../runs` (display_title).
#
# release-split: profile `release`, dispatched on a branch, is the pre-check of a
# release: `gh workflow run pull_request.yaml --ref <branch> -f profile=release`.
# It tests the branch head, builds the release files and uploads them as the
# artifact `release-dist-<version>`. It never tags and never publishes: that is
# release.yml, which the operator starts, and which publishes this run's files.
# 0.1.11.1: ONE cut-down lane. Profiles `pr` (every push) and `release` (the pre-check) run the same
# blocking jobs: lint, the fast unit lane, the tests of the changed files (PR only), the wheel, the core-flow
# smoke on a small home, eval scoring and the UI bundle check; `release` adds the release metadata, the build
# and the artifact smoke. The 4-shard source suite, the browser tests, the 290k-posting gate and the macOS
# smoke are in profile `full`: non-blocking, nightly (compatibility_job.yaml) and after each release.
run-name: Pull request (${{ inputs.profile || 'pr' }})

on:
  pull_request:
  workflow_call:
    inputs:
      profile:
        description: "CI profile: pr (the cut-down lane, ubuntu/3.11), release = the release pre-check (the same lane + release metadata, build and artifact smoke), or full = the non-blocking sweep (4-shard source suite on ubuntu 3.11/3.12/3.13 and macOS 3.13, browser tests, the 290k-posting gate, macOS smoke, sharded Debian offline)."
        required: false
        type: string
        default: pr
      ref:
        description: Exact ref to test when called by another workflow.
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      profile:
        description: "CI profile to run on this branch. release = the pre-check of a release (nothing is tagged or published); full = the non-blocking sweep."
        required: false
        type: choice
        options:
          - pr
          - release
          - full
        default: pr

permissions:
  contents: read

# 0.1.11: the release pre-check (profile `release`) runs the release-gate-only tests (tests/behaviors/ci_tooling/
# test_docs_no_fill_markers.py: no '[FILL' placeholder may ship). release.yml publishes only a green run of this profile, so
# a placeholder page fails here and cannot be skipped by forgetting a lane.
env:
  GIGAI_RELEASE_GATE: ${{ inputs.profile == 'release' && '1' || '' }}

concurrency:
  group: gigai-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect implementation changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      code_changed: ${{ steps.detect.outputs.code_changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_ACTION: ${{ github.event.action }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PROFILE: ${{ inputs.profile || 'pr' }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WORKFLOW_FILE: pull_request.yaml
        run: python3 tools/ci_changes.py

  # 0110-10-08: names the package uses and never defines (`make lint`: ruff over
  # src/gigai, the ruff version pinned in the Makefile). 0.1.10.9 shipped
  # `time.monotonic()` in a module with no `import time`, on a line only a large store
  # reaches. It does not wait for `changes` and has no condition: every PR, every
  # profile, a few seconds. A finding fails the run, so a release pre-check with one is
  # not green. 0110-10-hf2: every pyflakes rule (`--select F`): undefined names, and
  # imports, variables and redefinitions nothing uses.
  lint:
    name: Lint (pyflakes, undefined names and unused imports)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: make lint

  source-matrix:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true' && (inputs.profile || 'pr') == 'full'
    name: Compute source-suite matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - id: matrix
        env:
          PROFILE: ${{ inputs.profile || 'pr' }}
          # ci-shard-suite: every OS x Python entry below runs as this many
          # source-tests jobs. The only place the number is written: each
          # job's name and GIGAI_TEST_SHARDS read it back from the matrix.
          SHARDS: "4"
        run: |
          case "${PROFILE}" in
            full)
              # 0.1.11.1: the whole source suite, 4 shards per entry, non-blocking. ubuntu/3.11 is
              # here because the PR no longer runs the shards. (The cases pr and release do not
              # exist: the job above does not run for them.)
              # ci-spike: the post-release sweep. ubuntu/3.11 is not repeated
              # (the gate ran it). macOS runs one Python (3.13, the newest; the
              # gate's smoke uses 3.12): GitHub allows 5 concurrent macOS jobs,
              # so 4 shards fit in one wave. Add {"os":"macos-latest","python":"3.11"}
              # here for an on-demand floor check (a second wave, ~+20 min).
              entries='[{"os":"ubuntu-24.04","python":"3.11"},{"os":"ubuntu-24.04","python":"3.12"},{"os":"ubuntu-24.04","python":"3.13"},{"os":"macos-latest","python":"3.13"}]'
              ;;
            *)
              echo "unknown profile: ${PROFILE}" >&2
              exit 1
              ;;
          esac
          # The runner's own python3, as in the changes job: no checkout here.
          include="$(ENTRIES="${entries}" python3 -c '
          import json, os
          shards = int(os.environ["SHARDS"])
          include = [
              {**entry, "shard": shard, "shards": shards}
              for entry in json.loads(os.environ["ENTRIES"])
              for shard in range(1, shards + 1)
          ]
          print(json.dumps(include, separators=(",", ":")))
          ')"
          echo "include=${include}" >> "${GITHUB_OUTPUT}"

  source-tests:
    needs: source-matrix
    name: All tests (source) (Python ${{ matrix.python }} on ${{ matrix.os }}, shard ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ${{ matrix.os }}
    # measured 2026-09-23: ubuntu 16.4m, macOS >20m (20 killed the v0.1.8 release).
    # measured 2026-09-28 (run 36389735708, 'full' profile on b9b4c02): all three
    # macOS jobs were cancelled by the 45-minute timeout at ~78% with zero
    # failures, so macOS needs ~60m; ubuntu finished green inside 45.
    # ci-shard-suite: those are whole-suite times. Each job now runs one of
    # 4 shards. uat-bug-037, measured per shard on run 36591142550 ('full'
    # profile on 07c0234): macOS max 25.4m (3.13 shard 4), ubuntu max 10.5m
    # (3.12 shard 4). Each limit is the smallest multiple of 5 that is at
    # least twice its OS's slowest shard: macOS 55 (2 x 25.4 = 50.8), ubuntu
    # 25 (2 x 10.5 = 21).
    timeout-minutes: ${{ contains(matrix.os, 'macos') && 55 || 25 }}
    # ci-spike: the sweep reports, it does not fail the run (see `sweep-summary`).
    continue-on-error: ${{ (inputs.profile || 'pr') == 'full' }}
    env:
      # ci-shard-suite: tests/conftest.py keeps only the test files whose
      # path hashes into this shard (tests/support/sharding.py); xdist then
      # runs inside the shard exactly as it did for the whole suite. Both
      # unset, as in a developer's own `make test-source`, runs everything.
      GIGAI_TEST_SHARDS: ${{ matrix.shards }}
      GIGAI_TEST_SHARD: ${{ matrix.shard }}
      # ci-shard-suite, measurement only: print each shard's 60 slowest
      # tests, so shard time can be read per file from the job log. Nothing
      # else in the source lane passes --durations (`make test-source` runs
      # pytest with the xdist options alone); selection and xdist are as before.
      PYTEST_ADDOPTS: "--durations=60"
      TEST_XDIST_WORKERS: auto
      # ubuntu-24.04 runners are 4 vCPU; macos-latest runners are 3 vCPU.
      # _xdist_options() clamps to min(requested, max, os.cpu_count()) anyway,
      # so this cap is a documented ceiling, not the binding constraint.
      TEST_XDIST_MAX_WORKERS: ${{ contains(matrix.os, 'macos') && '3' || '4' }}
      TEST_XDIST_DIST: worksteal
      # ci-fix-pr37-r2: shared runners are slower/noisier than a laptop --
      # observed 1.3s against a 1.0s wall-clock latency bound with no code
      # regression. tests/support/latency.py scales any bound built with
      # latency_bound() by this factor; it stays 1.0 (no change) everywhere
      # this var is unset, including a developer's own `make test-source`.
      # uat-bug-037: macOS runners get 7. A cold GET /api/config is 147 git
      # launches (tests/behaviors/scout_find_jobs/test_config_latency.py
      # counts them), and a launch there costs several times what it does on
      # ubuntu: run 36591142550 measured 3.007s against the 3.0s bound
      # (1.0s x 3). 7 is the smallest whole scale with 2x headroom over
      # that (2 x 3.007 = 6.01s). ubuntu stays 3.
      GIGAI_TEST_LATENCY_SCALE: ${{ contains(matrix.os, 'macos') && '7' || '3' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.source-matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra test --python "${{ matrix.python }}"
      - name: Source suite (shard ${{ matrix.shard }}/${{ matrix.shards }})
        run: make test-source

  behavior:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    name: Eval scoring check (frozen cases)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra test --python "3.11"
      - run: make test-behavior

  wheel:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    name: Wheel install + packaging checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra test --python "3.11"
      - run: make test-wheel

  scout-ui-freshness:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    name: Scout UI bundle is up to date
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v5
        with:
          # No "engines" field in src/gigai/scout/ui/package.json yet; pin to
          # Node 22 LTS until one is added.
          node-version: "22"
      - name: Install UI dependencies
        working-directory: src/gigai/scout/ui
        run: yarn --frozen-lockfile install
      - name: Build UI
        working-directory: src/gigai/scout/ui
        run: yarn build
      - name: Fail if the built bundle differs from the committed one
        run: |
          if ! git diff --exit-code src/gigai/scout/ui/dist; then
            echo "::error::src/gigai/scout/ui/dist is stale; run 'yarn build' in src/gigai/scout/ui and commit the result" >&2
            exit 1
          fi

  # U4 (0.1.10.9): the browser tests (tests/ui). Real Chromium against the real Scout
  # server on a small synthetic home (`make ui-test`: no network, no model, never a
  # real home). 0.1.11.1: profile `full` only (non-blocking: nightly and after each release); the
  # PR and the pre-check no longer run it.
  # What fails the job from day one: structure (request counts, one request in flight
  # per resource, what the page shows) and console / page / HTTP problems. The timing
  # ceilings (wall-clock, server CPU, server memory) are REPORTED for the first week
  # (GIGAI_UI_BUDGETS: report): in the job summary and in the budgets artifact of every
  # run. Set the limits from a week of those, then write `enforce` here and in
  # `operator-home`.
  # No retry, on purpose (tests/ui/README.md): no rerun flag and no retry action. A wait
  # that times out writes timeout.txt (what was in flight, the page's heartbeat, whether
  # the server answered, the console, the server log) into the failure artifact.
  # Time limits: `make ui-test` (25 tests) took 137 s on a busy laptop on 2026-10-04,
  # 34 s of it the home build (U3 measured 70 s idle when the suite was 20 tests). The
  # step gets the smallest multiple of 5 minutes that is at least 3 times that
  # (3 x 137 s = 6.9 min -> 10). A step that reaches its limit is a failed step, so the
  # summary and the artifacts are still uploaded; the job limit only has to leave room
  # for the setup before the step and the uploads after it. NOT measured on a runner yet.
  ui:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true' && (inputs.profile || 'pr') == 'full'
    name: Browser tests (small home)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    env:
      GIGAI_UI_BUDGETS: report
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra test --group ui --python "3.11"
      # ui-browser-setup: the three steps below are the same in `operator-home`
      # (tests/behaviors/ci_tooling/test_ui_ci_job.py compares them). The browser is
      # installed here, not inside the timed test step: on a cache hit only the system
      # libraries are installed (they are not in the cache).
      - name: Playwright version (the key of the browser cache)
        id: playwright
        run: |
          version="$(uv run --locked --extra test --group ui python -c 'from importlib.metadata import version; print(version("playwright"))')"
          test -n "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Chromium, cached per Playwright version
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Chromium and its system libraries
        run: uv run --locked --extra test --group ui playwright install --with-deps chromium
      - name: Browser tests on the small home
        timeout-minutes: 10
        run: make ui-test
      - name: Budgets in the job summary
        if: ${{ !cancelled() }}
        run: python3 tools/ui_budgets_summary.py build/ui-artifacts/budgets.json --title "small home (make ui-test)" >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload budgets.json (every run)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-budgets-small-home-attempt-${{ github.run_attempt }}
          path: build/ui-artifacts/budgets.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload the failure artifacts (screenshot, trace, requests, console, server log, timeout.txt)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-failure-small-home-attempt-${{ github.run_attempt }}
          path: build/ui-artifacts/
          if-no-files-found: warn
          retention-days: 14

  # 0.1.11.1: the lane both profiles run. `make unit-tests` is the fast_unit lane (2,730 tests, 107 s on a
  # laptop with 4 workers); the release pre-check adds the no-[FILL] gate. A PR push also runs
  # `changed-tests` beside it. Measured before the cut: the 4 shards took 8-15 min.
  fast-tests:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true' && (inputs.profile || 'pr') != 'full'
    name: Fast unit lane (+ no placeholder ships, release)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GIGAI_TEST_LATENCY_SCALE: "3"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra test --python "3.11"
      - name: Fast unit lane
        run: make unit-tests UNIT_WORKERS=4
      - name: No placeholder ships (release pre-check)
        if: inputs.profile == 'release'
        run: uv run --locked --extra test pytest -q -n 0 tests/behaviors/ci_tooling/test_docs_no_fill_markers.py

  # 0.1.11.1: PR only. The test files that import what this push changed (tools/ci_select_tests.py). Its own
  # job so it runs beside the unit lane, not after it.
  changed-tests:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true' && github.event_name == 'pull_request'
    name: Tests of the files this push changed
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GIGAI_TEST_LATENCY_SCALE: "3"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra test --python "3.11"
      - name: Select and run
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${BEFORE_SHA}"
          case "${base}" in ""|0000000000000000000000000000000000000000) base="${BASE_SHA}" ;; esac
          git cat-file -e "${base}^{commit}" 2>/dev/null || base="${BASE_SHA}"
          make test-changed BASE="${base}"

  # 0.1.11.1: the core-flow smoke on a SMALL home (15,000 postings, 1,200 companies): the wheel built and
  # installed with uv into a clean environment, then the installed `gigai` command through `scout new` and
  # the commands around it, cold then warm (23 steps). 87 s on a laptop. The operator-sized form is in
  # `operator-home` (profile full).
  core-flow:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true' && (inputs.profile || 'pr') != 'full'
    name: Core-flow smoke (the wheel's gigai command, small home)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra test --python "3.11"
      - name: Core flow, cold then warm
        run: make test-core-flow CORE_FLOW_OUT=build/core-flow CORE_FLOW_ARGS="--postings 15000 --companies 1200"
      - name: Core-flow table in the job summary
        if: ${{ !cancelled() }}
        run: cat build/core-flow/table.md >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload every step's output on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: core-flow-failure-attempt-${{ github.run_attempt }}
          path: build/core-flow/
          if-no-files-found: warn
          retention-days: 14

  debian-offline:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true' && (inputs.profile || 'pr') == 'full'
    name: Debian 12 offline container (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    # measured 2026-09-29 (run 36614963298): the whole suite in one container
    # took 33.5 min; 4 shards of it are expected at ~9-10 min each.
    timeout-minutes: 25
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/debian-offline/Dockerfile
          tags: gigai-debian-offline:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: >-
          docker run --rm
          --network none
          --read-only
          --user 10001:10001
          --tmpfs /tmp:rw,exec,nosuid,nodev,mode=1777
          --tmpfs /audit/home:rw,nosuid,nodev,uid=10001,gid=10001,mode=0700
          --tmpfs /audit/target:rw,nosuid,nodev,uid=10001,gid=10001,mode=0700
          --tmpfs /audit/workpad:rw,nosuid,nodev,uid=10001,gid=10001,mode=0700
          --env HOME=/audit/home
          --env GIGAI_AUDIT_HOME=/audit/home
          --env GIGAI_AUDIT_TARGET=/audit/target
          --env GIGAI_AUDIT_WORKPAD=/audit/workpad
          --env GIGAI_TEST_LATENCY_SCALE=3
          --env GIGAI_TEST_SHARDS=4
          --env GIGAI_TEST_SHARD=${{ matrix.shard }}
          gigai-debian-offline:${{ github.sha }}

  # ci-spike: the gate's macOS check. Not the macOS suite (that is the sweep):
  # build the wheel, install it, start/stop a Scout server, and run the files
  # that failed on macOS in 0.1.8-0.1.9 (server health, port takeover, installed
  # init scenarios, config/latency journey). ~5-8 min, one runner.
  macos-smoke:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true' && inputs.profile == 'full'
    name: macOS smoke (Python 3.12)
    runs-on: macos-latest
    timeout-minutes: 25
    continue-on-error: true
    env:
      TEST_XDIST_MAX_WORKERS: "3"
      GIGAI_TEST_LATENCY_SCALE: "7"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra test --python "3.12"
      - name: Built wheel installs and starts
        run: |
          uv build --wheel --no-sources --out-dir "${RUNNER_TEMP}/dist"
          uv venv --python 3.12 "${RUNNER_TEMP}/venv"
          uv pip install --python "${RUNNER_TEMP}/venv/bin/python" "${RUNNER_TEMP}"/dist/*.whl
          "${RUNNER_TEMP}/venv/bin/gigai" --version
          "${RUNNER_TEMP}/venv/bin/gigai" --help >/dev/null
      - name: macOS smoke tests
        run: make test-macos-smoke

  # 0110-9-01: the operator-sized timing gate (profile `release` only). 0.1.10.8 passed
  # every check and its Jobs page never finished loading on a home of 290,000 postings
  # and 10,350 companies: no check ran on a home of that size. This runs the real server
  # process on a synthetic one (no request, no real home): one build for 8 requests at
  # once, progress and responsive routes during it, warm reads under 500 ms, bounded
  # memory, a warm fresh process, and (0110-10-08) `gigai scout new --no-assess --json`
  # doing the first build itself, in its own process, with the server stopped (0.1.10.9
  # crashed there). A failed job fails the pre-check run, so release.yml finds no green
  # run to release.
  # U4 (0.1.10.9): the same job then loads the UI on that home in a real browser
  # (`make ui-test-operator`: the `operator_sized` half of `make ui-test-full`; the `ui`
  # job runs the other half on the small home). The home is built ONCE: the build step
  # leaves it, never read, at <root>.pristine, and the gate and the browser flows each
  # take a fresh copy at the root it was built for (GIGAI_OPERATOR_HOME_PREBUILT;
  # tests/support/operator_home.py), so both start on a server that has read nothing.
  # The browser steps run whatever the timing gate did: one pre-check run shows both.
  # Timing ceilings of the browser flows are reported, as in `ui`; the timing GATE above
  # them is unchanged and blocks.
  # Step limits, from the laptop times of 2026-10-04 (a busy laptop), each the smallest
  # multiple of 5 minutes that is at least 3 times its step: the build 44 to 50 s -> 5;
  # the browser flows 61 s -> 5. The gate took 42 s on the prebuilt home (-> 5 by the
  # same rule) and gets 10: it is the blocking gate that had no limit of its own, and a
  # limit that is too tight would fail a release for nothing. NOT measured on a runner yet.
  # 0110-10-hf2: the same job then runs the CORE-FLOW SMOKE (`make test-core-flow`,
  # tools/core_flow.py) on a third fresh copy of that home: the wheel is built and
  # installed with uv into a clean environment, and the installed `gigai` command runs
  # the daily flow to its end, first with no server and a read model never built, then
  # again with the server running (resume add, sources update against local fixture
  # boards, new --no-assess, new --yes, jobs list, assess, resume tailor, master init,
  # master selection refresh, status). A non-zero exit, a traceback or "Error" on stderr,
  # or stdout that is not JSON fails the step, and so the pre-check. Its table goes to
  # the job summary and into the every-run artifact; each step's output is under
  # build/ui-artifacts/core-flow/logs/, so a failed run uploads it with the rest. Step
  # limit by the same rule: 6 min on a laptop on 2026-10-04 -> 20. The job's limit is
  # the steps' limits plus 10 minutes for the setup and the uploads.
  # 0.1.10.11 SGATE: the same job then runs the WRITE TIMING GATE (`make
  # test-operator-writes`, tests/behaviors/scout_pipeline/test_operator_sized_writes.py)
  # in REPORT mode. The bar is no interactive operation over 1 s on this home; the
  # 0.1.10.10 S1 measurement found saves that take minutes once the background pipeline
  # has finished jobs. The gate adds that content to a fresh copy of the prebuilt home (a
  # stored master, finished pipeline jobs for both profiles, a question every assessed job
  # asked), then times thirteen saves and reads, each on a fresh copy and a fresh server
  # process, with the git processes each one started. Its table goes to the job summary
  # and the every-run artifact. In report mode an operation over the bar is a row of the
  # table, not a failure: the step fails only when an operation is refused or a finished
  # one starts more git processes than its ceiling. `GIGAI_WRITE_GATE: enforce` makes an
  # operation over the bar fail the step; switch it when the speed packets have landed.
  # GIGAI_WRITE_GATE_JOBS is 25 finished pipeline jobs per profile, not the fixture's 100:
  # before the pipeline's own speed fix (S2) a job costs seconds to build, and 100 a
  # profile would take this step past half an hour. Every row of the table names the job
  # count. Raise it to 100 (delete the line) when S2 has landed. Step limit by the same
  # rule: 13 min on a busy laptop on 2026-10-04 at 25 jobs a profile (the content 7, the
  # operations 6) -> 40. NOT measured on a runner yet.
  operator-home:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true' && inputs.profile == 'full'
    name: Operator-sized home timing gate, browser flows and core-flow smoke (290k postings)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: true
    env:
      GIGAI_TEST_LATENCY_SCALE: "3"
      GIGAI_UI_BUDGETS: report
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra test --python "3.11"
      - name: Build the operator-sized home once (for the timing gate and the browser flows)
        id: home
        timeout-minutes: 5
        run: |
          # Under /tmp: the generator refuses any root outside the temporary directory.
          home="$(mktemp -d /tmp/gigai-operator-XXXXXX)"
          uv run --locked --extra test python -m tests.support.operator_home "${home}/op" --pristine
          echo "GIGAI_OPERATOR_HOME_PREBUILT=${home}/op" >> "${GITHUB_ENV}"
      - name: Operator-sized home timing gate
        timeout-minutes: 10
        run: make test-operator-home
      - name: Add the browser-test dependencies
        if: ${{ !cancelled() && steps.home.outcome == 'success' }}
        run: uv sync --locked --extra test --group ui --python "3.11"
      # ui-browser-setup: the three steps below are the same as in `ui`.
      - name: Playwright version (the key of the browser cache)
        id: playwright
        if: ${{ !cancelled() && steps.home.outcome == 'success' }}
        run: |
          version="$(uv run --locked --extra test --group ui python -c 'from importlib.metadata import version; print(version("playwright"))')"
          test -n "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Chromium, cached per Playwright version
        if: ${{ !cancelled() && steps.home.outcome == 'success' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Chromium and its system libraries
        if: ${{ !cancelled() && steps.home.outcome == 'success' }}
        run: uv run --locked --extra test --group ui playwright install --with-deps chromium
      - name: Browser flows on the operator-sized home
        if: ${{ !cancelled() && steps.home.outcome == 'success' }}
        timeout-minutes: 5
        run: make ui-test-operator
      # 0110-10-hf2: the core-flow smoke (see the comment above the job). It takes its own
      # fresh copy of the prebuilt home, and runs whatever the gate and the browser did.
      - name: Core-flow smoke (the wheel's gigai command on the operator-sized home, cold then warm)
        id: core_flow
        if: ${{ !cancelled() && steps.home.outcome == 'success' }}
        timeout-minutes: 20
        run: make test-core-flow CORE_FLOW_OUT=build/ui-artifacts/core-flow
      - name: Core-flow table in the job summary
        if: ${{ !cancelled() && steps.home.outcome == 'success' }}
        run: cat build/ui-artifacts/core-flow/table.md >> "${GITHUB_STEP_SUMMARY}"
      - name: Budgets in the job summary
        if: ${{ !cancelled() && steps.home.outcome == 'success' }}
        run: python3 tools/ui_budgets_summary.py build/ui-artifacts/budgets.json --title "operator-sized home (make ui-test-operator)" >> "${GITHUB_STEP_SUMMARY}"
      # 0.1.10.11 SGATE: the write timing gate, report mode (see the comment above the job).
      # Last of the checks: it takes its own fresh copy of the prebuilt home and runs
      # whatever the steps before it did.
      - name: Write timing gate on the operator-sized home (report mode)
        if: ${{ !cancelled() && steps.home.outcome == 'success' }}
        timeout-minutes: 40
        env:
          GIGAI_WRITE_GATE: report
          GIGAI_WRITE_GATE_JOBS: "25"
        run: make test-operator-writes
      - name: Write gate table in the job summary
        if: ${{ !cancelled() && steps.home.outcome == 'success' }}
        run: |
          if [ -f build/write-gate/table.md ]; then
            cat build/write-gate/table.md >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "### Write timing gate: no table (the gate stopped before its operations ran; see the step's log)" >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Upload budgets.json, the flow's numbers and the core-flow table (every run)
        if: ${{ !cancelled() && steps.home.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-budgets-operator-home-attempt-${{ github.run_attempt }}
          path: |
            build/ui-artifacts/budgets.json
            build/ui-artifacts/operator-sized-jobs.json
            build/ui-artifacts/core-flow/table.md
            build/write-gate/table.md
            build/write-gate/table.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload the failure artifacts (screenshot, trace, requests, console, server log, timeout.txt; the core-flow steps' output)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-failure-operator-home-attempt-${{ github.run_attempt }}
          path: build/ui-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # release-split: the release half of the pre-check (profile `release` only).
  # Everything release.yml used to check before publishing, on the branch head:
  # the version in pyproject.toml has a CHANGELOG section, a matching
  # CATALOG_REVISION and uv.lock entry, is on an allowed branch, and has no tag
  # and no PyPI release yet.
  release-preflight:
    if: inputs.profile == 'release'
    name: Release metadata (version, CHANGELOG, tag and PyPI not taken)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}
      - id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python3 -m tools.release_dispatch --precheck --sha "$(git rev-parse HEAD)" --version "${version}" --branch "${BRANCH}"
          python3 tools/release_check.py verify-lockfile
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  # release-split: the files a release publishes are built here, once.
  # release.yml downloads this artifact from this run; it does not build.
  release-build:
    needs: release-preflight
    name: Build the release files (sdist + wheel)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: rm -rf dist
      - run: uv build --no-sources
      - run: python tools/release_check.py verify-artifacts
      - run: python tools/release_check.py write-checksums
      - run: python tools/release_check.py verify-checksums
      - uses: actions/upload-artifact@v4
        with:
          # tools/release_gate.py (DIST_ARTIFACT_PREFIX) looks this name up.
          name: release-dist-${{ needs.release-preflight.outputs.version }}
          if-no-files-found: error
          path: dist/

  release-smoke-artifacts:
    needs: [release-preflight, release-build]
    name: Fresh wheel and source-distribution smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/download-artifact@v4
        with:
          name: release-dist-${{ needs.release-preflight.outputs.version }}
          path: dist
      - env:
          VERSION: ${{ needs.release-preflight.outputs.version }}
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            root="$(mktemp -d)"
            uv venv --python 3.11 "${root}/venv"
            uv pip install --python "${root}/venv/bin/python" "${artifact}"
            "${root}/venv/bin/gigai" --version | grep -Fx "gigai ${VERSION}"
            "${root}/venv/bin/gigai" --help >/dev/null
            "${root}/venv/bin/gigai" setup --non-interactive --home "${root}/home" --workpad-root "${root}/workpad" --editor /usr/bin/true \
              --credential-ref provider=environment:GIGAI_PROVIDER_TOKEN \
              --endpoint remote=openai_api:provider:https://api.example.test \
              --model-target remote=remote:smoke-test \
              --create-model-target remote \
              --json >/dev/null
            "${root}/venv/bin/gigai" doctor --home "${root}/home" --json >/dev/null
          done

  # ci-spike: the sweep's report. Runs after the sweep jobs whatever they did and
  # lists what failed in the run summary; it never fails the run itself.
  sweep-summary:
    needs: [source-tests, debian-offline, ui, macos-smoke, operator-home]
    if: always() && (inputs.profile || 'pr') == 'full'
    name: Compatibility sweep summary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ inputs.ref || github.sha }}
        run: |
          {
            echo "## Compatibility sweep on ${SHA}"
            echo
            echo "| Job | Result | Minutes |"
            echo "| --- | --- | --- |"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" --paginate \
              --jq '.jobs[] | select(.name | test("All tests|Debian|Browser|macOS|Operator")) | select(.conclusion != "skipped") | "| \(.name) | \(.conclusion // .status) | \(if .completed_at then (((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) / 60 | floor) else "-" end) |"'
            echo
            echo "A failed row is a compatibility weakness to look at, not a release failure."
          } >> "${GITHUB_STEP_SUMMARY}"
