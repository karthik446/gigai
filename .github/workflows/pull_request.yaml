name: Pull request

on:
  pull_request:
  workflow_call:
    inputs:
      full_matrix:
        description: Run every supported Python and operating-system combination.
        required: false
        type: boolean
        default: false
      ref:
        description: Exact ref to test when called by another workflow.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  changes:
    name: Detect implementation changes
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.detect.outputs.code_changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FULL_MATRIX: ${{ inputs.full_matrix }}
          SHA: ${{ github.sha }}
        run: |
          if [ "${FULL_MATRIX}" = "true" ]; then
            code_changed=true
            changed="full compatibility profile"
          elif [ "${EVENT_NAME}" = "pull_request" ]; then
            changed="$(git diff --name-only "${BASE_SHA}...${SHA}")"
            code_changed=false
            if [ -n "${changed}" ]; then
              while IFS= read -r path; do
                case "${path}" in
                  *.md|*.markdown) ;;
                  *) code_changed=true; break ;;
                esac
              done <<< "${changed}"
            fi
          else
            changed="$(git diff --name-only "${SHA}^" "${SHA}")"
            code_changed=false
            if [ -n "${changed}" ]; then
              while IFS= read -r path; do
                case "${path}" in
                  *.md|*.markdown) ;;
                  *) code_changed=true; break ;;
                esac
              done <<< "${changed}"
            fi
          fi
          echo "code_changed=${code_changed}" >> "${GITHUB_OUTPUT}"
          echo "implementation changes: ${code_changed}"

  source-tests:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    name: G28 readiness tiers (Python ${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.full_matrix && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
        python: ${{ fromJSON(inputs.full_matrix && '["3.11", "3.12", "3.13"]' || '["3.11"]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra test --python "${{ matrix.python }}"
      - name: G28 unit and contract tier
        if: ${{ !inputs.full_matrix }}
        run: python tools/run_g28_tier.py unit
      - name: G28 integration tier
        if: ${{ !inputs.full_matrix }}
        run: python tools/run_g28_tier.py integration
      - name: G28 behavioral evaluation tier
        if: ${{ !inputs.full_matrix }}
        run: python tools/run_g28_tier.py behavior
      - name: Full source suite
        if: ${{ inputs.full_matrix }}
        run: uv run --locked pytest

  wheel:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    name: Built-wheel resources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
      - run: rm -rf dist
      - run: uv build
      - run: uv venv --python 3.11 .wheel-venv
      - run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          set -- "dist/gigai-${version}-"*.whl
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "expected exactly one built GigAI wheel for version ${version}" >&2
            exit 1
          fi
          uv pip install --python .wheel-venv/bin/python "$1"
      - run: .wheel-venv/bin/python tools/verify_installed_schemas.py
      - run: .wheel-venv/bin/python tools/verify_installed_canonical.py
      - run: .wheel-venv/bin/python tools/verify_installed_cli.py
      - if: ${{ inputs.full_matrix }}
        run: .wheel-venv/bin/python tools/verify_installed_g03.py
      - if: ${{ inputs.full_matrix }}
        run: .wheel-venv/bin/python tools/verify_installed_g04.py
      - if: ${{ inputs.full_matrix }}
        run: .wheel-venv/bin/python tools/verify_installed_g05.py
      - if: ${{ inputs.full_matrix }}
        run: .wheel-venv/bin/python tools/verify_installed_g06.py
      - if: ${{ inputs.full_matrix }}
        run: .wheel-venv/bin/python tools/verify_installed_g07.py
      - if: ${{ inputs.full_matrix }}
        run: .wheel-venv/bin/python tools/verify_installed_g08.py
      - if: ${{ inputs.full_matrix }}
        run: .wheel-venv/bin/python tools/verify_installed_g09.py
      - if: ${{ inputs.full_matrix }}
        run: .wheel-venv/bin/python tools/verify_installed_g11.py
      - if: ${{ inputs.full_matrix }}
        run: .wheel-venv/bin/python tools/verify_installed_g13.py
      - if: ${{ inputs.full_matrix }}
        run: .wheel-venv/bin/python tools/verify_installed_g14.py
      - if: ${{ inputs.full_matrix }}
        run: .wheel-venv/bin/python tools/verify_installed_g15.py
      - if: ${{ inputs.full_matrix }}
        run: .wheel-venv/bin/python tools/verify_installed_g16.py
      - if: ${{ inputs.full_matrix }}
        run: .wheel-venv/bin/python tools/verify_installed_g17.py
      - if: ${{ inputs.full_matrix }}
        run: .wheel-venv/bin/python tools/verify_installed_g19.py
      - if: ${{ inputs.full_matrix }}
        run: .wheel-venv/bin/python tools/verify_installed_g20.py
      - if: ${{ inputs.full_matrix }}
        run: .wheel-venv/bin/python tools/verify_installed_g21.py
      - if: ${{ inputs.full_matrix }}
        run: .wheel-venv/bin/python tools/verify_installed_g23.py
      - run: .wheel-venv/bin/python tools/verify_installed_g28.py
      - run: >-
          uv run --locked --extra test pytest
          tests/test_cli_and_scenario_harness.py
          tests/test_g*_installed_scenarios.py
          tests/test_g10_phase1_audit.py
          -k 'installed_help_version or installed_'
        if: ${{ inputs.full_matrix }}
        env:
          GIGAI_TEST_EXECUTABLE: ${{ github.workspace }}/.wheel-venv/bin/gigai

  debian-offline:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true' && inputs.full_matrix
    name: Debian 12 offline container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - run: docker build --tag gigai-debian-offline:${{ github.sha }} --file containers/debian-offline/Dockerfile .
      - run: >-
          docker run --rm
          --network none
          --read-only
          --user 10001:10001
          --tmpfs /tmp:rw,exec,nosuid,nodev,mode=1777
          --tmpfs /audit/home:rw,nosuid,nodev,uid=10001,gid=10001,mode=0700
          --tmpfs /audit/target:rw,nosuid,nodev,uid=10001,gid=10001,mode=0700
          --tmpfs /audit/workpad:rw,nosuid,nodev,uid=10001,gid=10001,mode=0700
          --env HOME=/audit/home
          --env GIGAI_AUDIT_HOME=/audit/home
          --env GIGAI_AUDIT_TARGET=/audit/target
          --env GIGAI_AUDIT_WORKPAD=/audit/workpad
          gigai-debian-offline:${{ github.sha }}
