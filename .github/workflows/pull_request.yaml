name: Pull request

on:
  pull_request:
  workflow_call:
    inputs:
      profile:
        description: "CI profile: pr (ubuntu/3.11), release (macOS+ubuntu/3.12), or full (macOS+ubuntu x 3.11/3.12/3.13 + Debian offline)."
        required: false
        type: string
        default: pr
      ref:
        description: Exact ref to test when called by another workflow.
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      profile:
        description: "CI profile to run on this branch, without tagging."
        required: false
        type: choice
        options:
          - pr
          - release
          - full
        default: pr

permissions:
  contents: read

concurrency:
  group: gigai-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect implementation changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      code_changed: ${{ steps.detect.outputs.code_changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_ACTION: ${{ github.event.action }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PROFILE: ${{ inputs.profile || 'pr' }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WORKFLOW_FILE: pull_request.yaml
        run: python3 tools/ci_changes.py

  source-matrix:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    name: Compute source-suite matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - id: matrix
        env:
          PROFILE: ${{ inputs.profile || 'pr' }}
        run: |
          case "${PROFILE}" in
            pr)
              include='[{"os":"ubuntu-24.04","python":"3.11"}]'
              ;;
            release)
              # Operator: everyone uses macOS, so that's the one to test at
              # release; the broad matrix runs nightly / post-release instead.
              include='[{"os":"macos-latest","python":"3.12"},{"os":"ubuntu-24.04","python":"3.12"}]'
              ;;
            full)
              include='[{"os":"ubuntu-24.04","python":"3.11"},{"os":"ubuntu-24.04","python":"3.12"},{"os":"ubuntu-24.04","python":"3.13"},{"os":"macos-latest","python":"3.11"},{"os":"macos-latest","python":"3.12"},{"os":"macos-latest","python":"3.13"}]'
              ;;
            *)
              echo "unknown profile: ${PROFILE}" >&2
              exit 1
              ;;
          esac
          echo "include=${include}" >> "${GITHUB_OUTPUT}"

  source-tests:
    needs: source-matrix
    name: All tests (source) (Python ${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45  # measured 2026-09-23: ubuntu 16.4m, macOS >20m (20 killed the v0.1.8 release)
    env:
      TEST_XDIST_WORKERS: auto
      # ubuntu-24.04 runners are 4 vCPU; macos-latest runners are 3 vCPU.
      # _xdist_options() clamps to min(requested, max, os.cpu_count()) anyway,
      # so this cap is a documented ceiling, not the binding constraint.
      TEST_XDIST_MAX_WORKERS: ${{ contains(matrix.os, 'macos') && '3' || '4' }}
      TEST_XDIST_DIST: worksteal
      # ci-fix-pr37-r2: shared runners are slower/noisier than a laptop --
      # observed 1.3s against a 1.0s wall-clock latency bound with no code
      # regression. tests/support/latency.py scales any bound built with
      # latency_bound() by this factor; it stays 1.0 (no change) everywhere
      # this var is unset, including a developer's own `make test-source`.
      GIGAI_TEST_LATENCY_SCALE: "3"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.source-matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra test --python "${{ matrix.python }}"
      - name: Full source suite
        run: make test-source

  behavior:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    name: Eval scoring check (frozen cases)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra test --python "3.11"
      - run: make test-behavior

  wheel:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    name: Wheel install + packaging checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra test --python "3.11"
      - run: make test-wheel

  scout-ui-freshness:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    name: Scout UI bundle is up to date
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v5
        with:
          # No "engines" field in src/gigai/scout/ui/package.json yet; pin to
          # Node 22 LTS until one is added.
          node-version: "22"
      - name: Install UI dependencies
        working-directory: src/gigai/scout/ui
        run: yarn --frozen-lockfile install
      - name: Build UI
        working-directory: src/gigai/scout/ui
        run: yarn build
      - name: Fail if the built bundle differs from the committed one
        run: |
          if ! git diff --exit-code src/gigai/scout/ui/dist; then
            echo "::error::src/gigai/scout/ui/dist is stale; run 'yarn build' in src/gigai/scout/ui and commit the result" >&2
            exit 1
          fi

  debian-offline:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true' && (inputs.profile || 'pr') == 'full'
    name: Debian 12 offline container
    runs-on: ubuntu-24.04
    timeout-minutes: 50  # docker build + full suite; not yet measured end to end
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/debian-offline/Dockerfile
          tags: gigai-debian-offline:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: >-
          docker run --rm
          --network none
          --read-only
          --user 10001:10001
          --tmpfs /tmp:rw,exec,nosuid,nodev,mode=1777
          --tmpfs /audit/home:rw,nosuid,nodev,uid=10001,gid=10001,mode=0700
          --tmpfs /audit/target:rw,nosuid,nodev,uid=10001,gid=10001,mode=0700
          --tmpfs /audit/workpad:rw,nosuid,nodev,uid=10001,gid=10001,mode=0700
          --env HOME=/audit/home
          --env GIGAI_AUDIT_HOME=/audit/home
          --env GIGAI_AUDIT_TARGET=/audit/target
          --env GIGAI_AUDIT_WORKPAD=/audit/workpad
          gigai-debian-offline:${{ github.sha }}
