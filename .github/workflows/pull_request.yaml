name: Pull request

on:
  pull_request:
  workflow_call:
    inputs:
      full_matrix:
        description: Run every supported Python and operating-system combination.
        required: false
        type: boolean
        default: false
      ref:
        description: Exact ref to test when called by another workflow.
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Run the release-equivalent full compatibility matrix on this branch, without tagging.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gigai-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect implementation changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code_changed: ${{ steps.detect.outputs.code_changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FULL_MATRIX: ${{ inputs.full_matrix }}
          SHA: ${{ github.sha }}
        run: |
          if [ "${FULL_MATRIX}" = "true" ]; then
            code_changed=true
            changed="full compatibility profile"
          elif [ "${EVENT_NAME}" = "pull_request" ]; then
            changed="$(git diff --name-only "${BASE_SHA}...${SHA}")"
            code_changed=false
            if [ -n "${changed}" ]; then
              while IFS= read -r path; do
                case "${path}" in
                  *.md|*.markdown) ;;
                  *) code_changed=true; break ;;
                esac
              done <<< "${changed}"
            fi
          else
            changed="$(git diff --name-only "${SHA}^" "${SHA}")"
            code_changed=false
            if [ -n "${changed}" ]; then
              while IFS= read -r path; do
                case "${path}" in
                  *.md|*.markdown) ;;
                  *) code_changed=true; break ;;
                esac
              done <<< "${changed}"
            fi
          fi
          echo "code_changed=${code_changed}" >> "${GITHUB_OUTPUT}"
          echo "implementation changes: ${code_changed}"

  source-tests:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    name: Source suite (Python ${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TEST_XDIST_WORKERS: auto
      # ubuntu-24.04 runners are 4 vCPU; macos-latest runners are 3 vCPU.
      # _xdist_options() clamps to min(requested, max, os.cpu_count()) anyway,
      # so this cap is a documented ceiling, not the binding constraint.
      TEST_XDIST_MAX_WORKERS: ${{ contains(matrix.os, 'macos') && '3' || '4' }}
      TEST_XDIST_DIST: worksteal
    strategy:
      fail-fast: false
      matrix:
        # full_matrix covers every Python on ubuntu, but only ONE Python on
        # macOS: macos-latest runners are far slower and costlier per minute,
        # and Python-version behavior is not OS-specific here (see report for
        # the coverage-risk note on dropping macOS 3.11/3.13).
        os: ${{ fromJSON(inputs.full_matrix && '["ubuntu-24.04", "macos-latest"]' || '["ubuntu-24.04"]') }}
        python: ${{ fromJSON(inputs.full_matrix && '["3.11", "3.12", "3.13"]' || '["3.11"]') }}
        exclude:
          - os: macos-latest
            python: "3.11"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra test --python "${{ matrix.python }}"
      - name: Full source suite
        run: make test-source

  behavior:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    name: Deterministic G28 behavior evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra test --python "3.11"
      - run: make test-behavior

  wheel:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    name: Built-wheel resources
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra test --python "3.11"
      - run: make test-wheel

  debian-offline:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true' && inputs.full_matrix
    name: Debian 12 offline container
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/debian-offline/Dockerfile
          tags: gigai-debian-offline:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: >-
          docker run --rm
          --network none
          --read-only
          --user 10001:10001
          --tmpfs /tmp:rw,exec,nosuid,nodev,mode=1777
          --tmpfs /audit/home:rw,nosuid,nodev,uid=10001,gid=10001,mode=0700
          --tmpfs /audit/target:rw,nosuid,nodev,uid=10001,gid=10001,mode=0700
          --tmpfs /audit/workpad:rw,nosuid,nodev,uid=10001,gid=10001,mode=0700
          --env HOME=/audit/home
          --env GIGAI_AUDIT_HOME=/audit/home
          --env GIGAI_AUDIT_TARGET=/audit/target
          --env GIGAI_AUDIT_WORKPAD=/audit/workpad
          gigai-debian-offline:${{ github.sha }}
