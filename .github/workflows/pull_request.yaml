name: Pull request

on:
  pull_request:
  workflow_call:
    inputs:
      full_matrix:
        description: Run every supported Python and operating-system combination.
        required: false
        type: boolean
        default: false
      ref:
        description: Exact ref to test when called by another workflow.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: gigai-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect implementation changes
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.detect.outputs.code_changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FULL_MATRIX: ${{ inputs.full_matrix }}
          SHA: ${{ github.sha }}
        run: |
          if [ "${FULL_MATRIX}" = "true" ]; then
            code_changed=true
            changed="full compatibility profile"
          elif [ "${EVENT_NAME}" = "pull_request" ]; then
            changed="$(git diff --name-only "${BASE_SHA}...${SHA}")"
            code_changed=false
            if [ -n "${changed}" ]; then
              while IFS= read -r path; do
                case "${path}" in
                  *.md|*.markdown) ;;
                  *) code_changed=true; break ;;
                esac
              done <<< "${changed}"
            fi
          else
            changed="$(git diff --name-only "${SHA}^" "${SHA}")"
            code_changed=false
            if [ -n "${changed}" ]; then
              while IFS= read -r path; do
                case "${path}" in
                  *.md|*.markdown) ;;
                  *) code_changed=true; break ;;
                esac
              done <<< "${changed}"
            fi
          fi
          echo "code_changed=${code_changed}" >> "${GITHUB_OUTPUT}"
          echo "implementation changes: ${code_changed}"

  source-tests:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    name: Source suite (Python ${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      TEST_XDIST_WORKERS: auto
      TEST_XDIST_MAX_WORKERS: "14"
      TEST_XDIST_DIST: worksteal
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.full_matrix && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
        python: ${{ fromJSON(inputs.full_matrix && '["3.11", "3.12", "3.13"]' || '["3.11"]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra test --python "${{ matrix.python }}"
      - name: Full source suite
        run: make test-source

  behavior:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    name: Deterministic G28 behavior evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra test --python "3.11"
      - run: make test-behavior

  wheel:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    name: Built-wheel resources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra test --python "3.11"
      - run: make test-wheel

  debian-offline:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true' && inputs.full_matrix
    name: Debian 12 offline container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - run: docker build --tag gigai-debian-offline:${{ github.sha }} --file containers/debian-offline/Dockerfile .
      - run: >-
          docker run --rm
          --network none
          --read-only
          --user 10001:10001
          --tmpfs /tmp:rw,exec,nosuid,nodev,mode=1777
          --tmpfs /audit/home:rw,nosuid,nodev,uid=10001,gid=10001,mode=0700
          --tmpfs /audit/target:rw,nosuid,nodev,uid=10001,gid=10001,mode=0700
          --tmpfs /audit/workpad:rw,nosuid,nodev,uid=10001,gid=10001,mode=0700
          --env HOME=/audit/home
          --env GIGAI_AUDIT_HOME=/audit/home
          --env GIGAI_AUDIT_TARGET=/audit/target
          --env GIGAI_AUDIT_WORKPAD=/audit/workpad
          gigai-debian-offline:${{ github.sha }}
