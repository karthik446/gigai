name: Release

# The operator's half of a release. One click, nothing to fill in:
#   Actions > Release > Run workflow > pick the branch > Run
#   (gh workflow run release.yml --ref karthik446/gigai-vX.Y.Z)
#
# It releases the head commit of that branch as the version in pyproject.toml.
# It runs no checks. The checks are the pre-check, dispatched beforehand (by the
# coordinator, as often as needed):
#   gh workflow run pull_request.yaml --ref <branch> -f profile=release
# `preflight` finds the green pre-check run on exactly this commit, or fails at
# once naming the pre-check to dispatch. Then: tag v<version> on the commit,
# publish that run's files to PyPI (nothing is rebuilt), GitHub Release, docs,
# fast-forward main. The PyPI install check, the compatibility sweep and the
# screenshot rebuild (`media`) come after the release and never fail this run.
#
# There is no tag-push trigger: a pushed tag would skip the pre-check rule.
run-name: Release ${{ github.ref_name }}

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Find the green pre-check on this commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      ref: ${{ steps.metadata.outputs.ref }}
      commit: ${{ steps.metadata.outputs.commit }}
      version: ${{ steps.metadata.outputs.version }}
      precheck_run: ${{ steps.precheck.outputs.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: metadata
        run: |
          if [ "${GITHUB_REF_TYPE}" != branch ]; then
            echo "::error::Release runs on a branch (main or karthik446/gigai-v*), not on the ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}"
            exit 1
          fi
          # the head of the branch when Run was clicked; everything below uses this commit
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"
          echo "ref=refs/tags/v${version}" >> "${GITHUB_OUTPUT}"
          echo "commit=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
      - id: precheck
        name: Green pre-check run on exactly this commit, with its release files
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: python3 tools/release_gate.py --commit "${GITHUB_SHA}" --branch "${GITHUB_REF_NAME}" --version "${VERSION}" >> "${GITHUB_OUTPUT}"
      - name: The version is still free (no PyPI release, no tag on another commit)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: python3 -m tools.release_dispatch --sha "${GITHUB_SHA}" --version "${VERSION}" --branch "${GITHUB_REF_NAME}"
      - name: Require the pypi publication environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/environments/pypi" --silent

  tag:
    name: Tag the commit and stage the pre-check's release files
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      artifact-metadata: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.commit }}
      - name: Download the release files the pre-check built and smoke-tested
        uses: actions/download-artifact@v4
        with:
          name: release-dist-${{ needs.preflight.outputs.version }}
          path: dist
          run-id: ${{ needs.preflight.outputs.precheck_run }}
          github-token: ${{ github.token }}
      # Not a rebuild: the downloaded wheel and sdist must be this version and
      # match the SHA256SUMS the pre-check wrote next to them.
      - run: python3 tools/release_check.py verify-checksums
      - name: Attest wheel and source distribution provenance
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Create the annotated tag on the commit
        env:
          RELEASE_SHA: ${{ needs.preflight.outputs.commit }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          # tools.release_dispatch (preflight) accepted an existing tag only when it
          # peels to exactly this commit and has no GitHub Release (a second run
          # after a partial one), so a matching tag is reused instead of re-created.
          if [ "$(git rev-parse -q --verify "refs/tags/v${RELEASE_VERSION}^{}" || true)" = "${RELEASE_SHA}" ]; then
            echo "tag v${RELEASE_VERSION} already exists at ${RELEASE_SHA}; reusing it"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "v${RELEASE_VERSION}" -m "GigAI ${RELEASE_VERSION}" "${RELEASE_SHA}"
            git push origin "refs/tags/v${RELEASE_VERSION}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          if-no-files-found: error
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: [preflight, tag]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - name: Prepare package-only publisher input
        run: |
          mkdir publish
          cp dist/*.whl dist/*.tar.gz publish/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish/

  github-release:
    name: Verify provenance and create GitHub Release
    needs: [preflight, publish-pypi]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      attestations: read
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            CHANGELOG.md
            tools/release_notes.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify dist/*.whl --repo "${GITHUB_REPOSITORY}"
          gh attestation verify dist/*.tar.gz --repo "${GITHUB_REPOSITORY}"
      - env:
          COMMIT: ${{ needs.preflight.outputs.commit }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          dist = Path("dist")
          artifacts = sorted(
              path for path in dist.iterdir() if path.name != "release-manifest.json"
          )
          manifest = {
              "schema_version": "1.0",
              "package": "gigai",
              "version": os.environ["VERSION"],
              "tag": os.environ["TAG"],
              "commit": os.environ["COMMIT"],
              "pypi_url": f"https://pypi.org/project/gigai/{os.environ['VERSION']}/",
              "github_release_url": f"https://github.com/{os.environ['REPOSITORY']}/releases/tag/{os.environ['TAG']}",
              "artifacts": [
                  {
                      "name": path.name,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      "size_bytes": path.stat().st_size,
                  }
                  for path in artifacts
              ],
          }
          (dist / "release-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - name: Extract this version's CHANGELOG section
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          if ! python tools/release_notes.py --version "${VERSION}" > release-notes.md; then
            : > release-notes.md
            echo "no CHANGELOG section found for ${VERSION}; falling back to --generate-notes"
          fi
      - env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          if [ -s release-notes.md ]; then
            gh release create "${TAG}" \
              --repo "${REPOSITORY}" \
              --verify-tag \
              dist/*.whl dist/*.tar.gz dist/SHA256SUMS dist/release-manifest.json \
              --title "GigAI ${VERSION}" \
              --notes-file release-notes.md
          else
            gh release create "${TAG}" \
              --repo "${REPOSITORY}" \
              --verify-tag \
              dist/*.whl dist/*.tar.gz dist/SHA256SUMS dist/release-manifest.json \
              --title "GigAI ${VERSION}" \
              --generate-notes
          fi

  media:
    name: Rebuild the release screenshots (never blocks the release)
    needs: [preflight, github-release]
    # 0110-049. A leaf, after the Release exists, continue-on-error: nothing waits on it, so a
    # failure here (a UI selector moved, the privacy gate found something) withholds only
    # the Release's image assets. `make media` builds a synthetic demo home in a temporary
    # HOME, takes the screenshots and runs the privacy gate (DOM text + OCR); nothing is
    # uploaded unless that gate passes. No secrets; the only network is the tool installs.
    # The docs do NOT take their images from this job: they embed the set committed under
    # gigai-docs/public/media/ (made with `make media-publish` and looked at before the
    # release), which the docs job publishes with the rest of the tag's tree.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: write   # gh release upload
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: OCR for the privacy gate, and Chromium's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr
          uv run --locked --group media playwright install-deps chromium
      - name: Build the screenshots and run the privacy gate
        run: make media
      - uses: actions/upload-artifact@v4
        with:
          name: release-media-${{ needs.preflight.outputs.version }}
          path: |
            build/media/*.png
            build/media/manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Attach the images to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: gh release upload "${TAG}" build/media/*.png build/media/manifest.json --repo "${GITHUB_REPOSITORY}" --clobber

  docs:
    name: Publish this version's docs (GitHub Pages)
    needs: [preflight, github-release]
    # Runs after the Release exists, so a docs failure never withholds a release;
    # re-run it with docs.yml's workflow_dispatch.
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: write
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      alias: latest

  advance-main:
    name: Fast-forward main to the release
    needs: [preflight, github-release]
    # main is the latest release and has no commits of its own, so it moves by a
    # fast-forward push: no post-release PR, no merge commit. A hotfix to an older
    # line (0.1.9.2 after 0.1.10) is not a descendant of main and is left alone.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - env:
          COMMIT: ${{ needs.preflight.outputs.commit }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          git fetch origin "refs/tags/${TAG}"
          if git merge-base --is-ancestor "${COMMIT}" origin/main; then
            echo "main already contains ${TAG}"
          elif git merge-base --is-ancestor origin/main "${COMMIT}"; then
            git push origin "${COMMIT}:refs/heads/main" || {
              echo "::warning::could not fast-forward main to ${TAG}; run: git push origin ${COMMIT}:main"
              exit 1
            }
            echo "main fast-forwarded to ${TAG} (${COMMIT})" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::warning::main is not an ancestor of ${TAG} (older release line, or main has its own commits); main left unchanged"
          fi

  verify-pypi:
    name: PyPI clean install on ${{ matrix.os }} (post-publish)
    needs: [preflight, github-release]
    # After the release; continue-on-error, so it never fails this run.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
      - env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          root="$(mktemp -d)"
          export HOME="${root}/home"
          export XDG_BIN_HOME="${root}/bin"
          export XDG_DATA_HOME="${root}/data"
          export PATH="${XDG_BIN_HOME}:${PATH}"

          deadline=$((SECONDS + 600))
          until uv tool install --refresh "gigai==${VERSION}"; do
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "gigai==${VERSION} did not appear on PyPI within 10 minutes" >&2
              exit 1
            fi
            echo "gigai==${VERSION} not yet available on PyPI; retrying in 15s"
            sleep 15
          done

          gigai --version | grep -Fx "gigai ${VERSION}"
          gigai --help >/dev/null
          gigai setup --non-interactive --home "${root}/gigai-home" --workpad-root "${root}/workpad" --editor /usr/bin/true \
            --credential-ref provider=environment:GIGAI_PROVIDER_TOKEN \
            --endpoint remote=openai_api:provider:https://api.example.test \
            --model-target remote=remote:smoke-test \
            --create-model-target remote \
            --json >/dev/null
          gigai doctor --home "${root}/gigai-home" --json >/dev/null

  post-release-compatibility:
    name: Start the compatibility sweep (its own run)
    needs: [preflight, github-release]
    # The sweep (compatibility_job.yaml: profile full, up to an hour on macOS) is
    # started as a separate run on the tag, so this run neither waits for it nor
    # takes its result.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          gh workflow run compatibility_job.yaml --repo "${GITHUB_REPOSITORY}" --ref "${TAG}" || {
            echo "::warning::could not start the compatibility sweep; run: gh workflow run compatibility_job.yaml --ref ${TAG}"
            exit 1
          }
