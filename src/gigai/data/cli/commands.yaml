    "scout prep": {
      "summary": "Prepare for an interview at a find-jobs-acquired posting.",
      "effect": "write",
      "external": "network",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai scout prep https://boards.greenhouse.io/acme/jobs/1 --budget 0.25"
      ],
      "notes": "OpenAI web_search for company research plus one model call for likely question categories; the resume goes only to the model call. Idempotent per (profile, posting, resume revision).",
      "hidden": true,
      "hiddenReason": "Hidden in 0.1.9/0.1.10: not part of the supported Scout surface yet; kept for internal use until its UX ships."
    },
    "scout profile list": {
      "summary": "List the profiles and what each one searches with.",
      "effect": "write",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object.",
