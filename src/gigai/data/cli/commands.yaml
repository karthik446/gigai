    "scout story delete": {
      "summary": "Remove a story.",
      "effect": "write",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object: {ok, schema_version, deleted}.",
      "examples": [
        "gigai scout story delete story:60_acme_ci_cut_time --confirm --revision 2 --json"
      ],
      "notes": "Needs --confirm. The story is never listed, searched or sent to a model again. With --revision (the value you read) the delete is refused with revision_conflict when the story changed since. The same body as DELETE /api/stories/{story_id}."
    },
    "scout story list": {
      "summary": "List the user's stories, with their tags and the jobs that used them.",
      "effect": "read",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object: {ok, schema_version, stories, total, tags}.",
      "examples": [
        "gigai scout story list --json",
        "gigai scout story list --search kubernetes --tag ci --json"
      ],
      "notes": "Stories belong to the user, not to a profile. Each story carries story_id, title, company, role, period, raw, narrative ({situation, task, action, result}), tags, answers_questions, sources, jobs (kind used), written_by (operator | agent), created_at, updated_at, revision and history. The same body as GET /api/stories."
    },
    "scout story prep": {
      "summary": "The basic interview prep list: the questions the stories answer, pooled.",
      "effect": "read",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object: {ok, schema_version, questions}.",
      "examples": [
        "gigai scout story prep --json"
      ],
      "notes": "answers_questions pooled across every story: one row per question, in first-seen order, with the stories that answer it ({question, stories: [{story_id, title}]}). Local, no model call. The same body as GET /api/stories/prep."
    },
    "scout story save": {
      "summary": "Save a story: a new one, or a change to the given fields of an existing one.",
      "effect": "write",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object: {ok, schema_version, story}.",
      "examples": [
        "gigai scout story save --file story.json --actor agent --json",
        "gigai scout story save --title \"Cut CI time 60% at Acme\" --company Acme --role \"Staff Engineer\" --period 2023 --raw-file words.md --situation \"Builds took forty minutes.\" --action \"Moved the runners to Kubernetes.\" --result \"Build time fell 60 percent.\" --tag ci --answers \"Tell me about a time you improved a slow process\" --actor agent --json",
        "gigai scout story save story:60_acme_ci_cut_time --period 2022-2023 --revision 1 --actor agent --json"
      ],
      "notes": "Local, no model call. A new story needs --title; its id is STORY_ID, else story:<the title's first words> as the id normalizer writes them. For an existing STORY_ID only the given fields change (a given narrative part replaces that part; --tag and --answers replace the whole list). --file takes one JSON object with the fields of POST /api/stories (title, company, role, period, raw, narrative, tags, answers_questions, sources, and optionally story_id); the options override it. Pass --revision (the revision you read) to be safe against a concurrent write: revision_conflict, with the current story in --json. story_exists when a new story's id is taken. Text holding an email, phone, link or street address in any field is refused (personal_info_refused). An assessment searches the stories for each job and puts only the few that match the posting into its prompt. The same story object as POST /api/stories and PUT /api/stories/{story_id}. 0.1.10.7: a saved story queues the pipeline for every job of an active profile whose assessment left open a question the story is about (at most pipeline.auto_jobs_per_trigger run, the rest wait for an approval); --json then carries pipeline {trigger, state, enqueued, awaiting_approval, unchanged, skipped, approval}."
    },
    "scout story show": {
      "summary": "Show one story in full.",
      "effect": "read",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object: {ok, schema_version, story}.",
      "examples": [
        "gigai scout story show story:60_acme_ci_cut_time --json"
      ],
      "notes": "STORY_ID is the story's id from list. Read revision from here before a save or delete with --revision. The same body as GET /api/stories/{story_id}."
    },
