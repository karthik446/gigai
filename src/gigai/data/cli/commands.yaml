        "gigai scout story save story:60_acme_ci_cut_time --period 2022-2023 --revision 1 --actor agent --json"
      ],
      "notes": "Local, no model call. A new story needs --title; its id is STORY_ID, else story:<the title's first words> as the id normalizer writes them. For an existing STORY_ID only the given fields change (a given narrative part replaces that part; --tag and --answers replace the whole list). --file takes one JSON object with the fields of POST /api/stories (title, company, role, period, raw, narrative, tags, answers_questions, sources, and optionally story_id); the options override it. Pass --revision (the revision you read) to be safe against a concurrent write: revision_conflict, with the current story in --json. story_exists when a new story's id is taken. Text holding an email, phone, link or street address in any field is refused (personal_info_refused). An assessment searches the stories for each job and puts only the few that match the posting into its prompt. The same story object as POST /api/stories and PUT /api/stories/{story_id}. 0.1.10.7: a saved story queues the pipeline for every job of an active profile whose assessment left open a question the story is about (at most pipeline.auto_jobs_per_trigger run, the rest wait for an approval); --json then carries pipeline {trigger, state, enqueued, awaiting_approval, unchanged, skipped, approval}."
    },
