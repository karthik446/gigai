      "notes": "The Scout server ranks in the background while it is open (a few calls at a time); this is for use without it. One model call ranks up to 50 postings, newest first, for each active profile; a deleted or archived profile is never ranked. The score is kept per posting, resume, settings and model, so a posting ranked once is not ranked again until one of those changes. All profiles share one daily allowance: rank.max_calls_per_day (100) and the warning level rank.warn_calls_per_day (60), in the project's settings file. A call past the warning level is made and warning is true; the call that would go over the maximum is not made: state is waiting (daily_cap_reached) and retry_at is the next local day. Other states: ran, idle (nothing to rank), yielded (a sources update, an assess batch or a find-jobs run is running), busy_elsewhere (the server is ranking now), disabled (rank.max_calls_per_day is 0, or the settings file cannot be read), unavailable (no usable model, or an answer that could not be read). Ids, counts and codes only: no posting or resume text."
