      "notes": "Local, code only: no model call and no request. The pick is 'gigai scout resume master selection show' for a posting that stands in for the profile: the keywords the postings its titles match in the local index ask for most often (up to 40 postings with text, read a few companies at a time in the watchlist's order; postings is how many were read), with the lines the profile shows now as the prior, fitted to 2 pages. With no matching posting it is the standing pick for the profile's titles (source titles). The view is stored as the next revision of the profile's own resume record (label master-selection.md) and the profile's resume_ref moves to it, so every reader of the profile's resume reads the selection; what was assessed or tailored on the earlier resume is re-opened as for any new resume. added and removed are the ids that came in and went against what the profile showed. --dry-run writes nothing. --profile ID (default: the selected profile) or --all (every active profile). --sync only prints the view again from the lines it already shows (an edited line's new wording in, a retired line out): nothing new is selected, and a profile whose view is current is not written. A new profile made with the app gets its first selection the same way when a master is stored and it names no resume of its own. No master yet: master_not_found."
