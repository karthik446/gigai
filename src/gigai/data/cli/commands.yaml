      "output": "Human-readable text; --json emits one JSON object: {ok, action: sync, status: imported | unchanged | written, written, master: {revision, revision_id, parent_revision, written_by, updated_at, content_sha256, record_id, counts}, changes: {added, removed, changed}, added: [{id, what: line | entry, section, entry_id, text}], changed: [same], retired: [same], ids: {kept, assigned, restored}, file: {name, path, state: current | changed, not_imported, revision, beside, written, wrote}, profiles: {synced: [{profile_id, label, action, changed, retired, resume_ref, shown, skills, pages}], offers: [{profile_id, label, new_lines, offer}]}, contact_removed: {removed: {}, lines: [], message: null, headings: [{kind: link, line, heading, where: heading | line_under_heading, message}]} when a link was taken out of a heading, else null}.",
