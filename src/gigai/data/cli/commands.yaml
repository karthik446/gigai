t copies and never moves: the old folder is left byte for byte as it was and no note is written into it; the output says it is a legacy place for job resumes now. Nothing in the jobs folder is replaced: a file you edited is copied as yours (resume.md when that name is free, else resume-2.md; GigAI never replaces it), two files of one job go into the job's one folder, and a job whose folder already holds the resume picked since is not given the older copy (counted as already). Listed and not moved: a file with no stored job (orphans: reason no_stored_job, or not_in_index for a markdown file GigAI did not write), a file with contact details (contact; the jobs folder never holds them), a file that is not text (other). A second run copies nothing ('already migrated: N'; what was imported is recorded in <home>/scout/jobs-folder-migration.json, names and digests only). counts.migrated is 0 in a dry run. legacy_pending is how many old files still wait; while it is not 0, this command and 'gigai scout status' (legacy_pending) print one line that offers the import. migrate takes no --set or --reset, and --dry-run goes only with migrate (invalid_value)."
