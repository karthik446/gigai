    "scout resume master selection show": {
      "summary": "Show which lines of your master resume a resume would show for a profile or one job, and why: Picked / Left out.",
      "effect": "read",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object: {ok, selection: {selector_version, max_pages, pages, pages_before_fit, last_page_fill, fits, layout_queries, counts: {picked, left_out, bullets, skills, skills_left_out, cut_for_length}, summary, entries: [{id, section, heading, sublines, shown, picked, left_out}], picked: [{id, section, kind, entry_id, text, code, reason}], left_out: [the same], skills: {picked: [{name, code, reason}], left_out: [the same]}, cut_for_length: [{id, kind, code, reason}], added_to_fill, only_evidence: [{id, terms}], shown_instead: [{id, of, terms}], roles_dropped, keywords, master: {revision, revision_id, parent_revision, written_by, updated_at, content_sha256, record_id}, profile, job, markdown}}. With --evidence: {ok, evidence: {selector_version, cap, chars, within_cap, bullets, bullets_total, summary, entries, skills, other, markdown, master, profile, job}}.",
      "examples": [
        "gigai scout resume master selection show --json",
        "gigai scout resume master selection show --job-url https://boards.greenhouse.io/acme/jobs/1 --json",
        "gigai scout resume master selection show --profile-title \"Staff AI Engineer\" --focus ai --job-text posting.txt --title \"Staff AI Engineer\" --json",
        "gigai scout resume master selection show --job-text posting.txt --title \"Staff AI Engineer\" --evidence"
      ],
      "notes": "Local, code only: no model call and no request; the selection is not stored. Without a job it is the profile's standing pick; with --job-url or --job-text it is the pick for that posting, made from the WHOLE master. --job-url reads a posting Scout already holds (the index, else the text a stored assessment was made on) by its URL or job identity; one it does not hold is refused with job_not_stored (pass --job-text FILE, or - for stdin, with --title and --company). --profile ID takes a stored profile's titles (default: the selected profile, resolved as every Scout command resolves it; none stored: no profile prior, profile is null); --profile-title T (repeatable) and --focus TAG (repeatable, a tag of the master's lines) select for titles without a stored profile. The rules: every line is scored against the posting (the keywords it names: a must-have counts double; the wording of the posting's requirement lines; the profile; a stated number; how recent its role is); one summary is shown, chosen by the posting's title and the profile; recent roles always appear; the pick is laid out with the shipped PDF template and cut until it fits 2 pages (max_pages) in one fixed order: the oldest role's lines, then that role, then the next oldest, and only then the lowest-value line of a recent role or project (never below 3 lines for the newest role and 2 for the other recent ones), then Other lines; a role is old when it ended more than 8 years ago. A line that is the only shown line naming a must-have of the posting is never cut: a recent role's line that names the same thing is shown in an old role's place first (shown_instead), else the old line stays and its role is shortened to it (only_evidence). Room left on the last page goes to more lines of recent roles (added_to_fill). Nothing is reworded: every shown line is a master line, by id. picked and left_out together hold every summary, bullet and Other line of the master once, each with a stable code and a reason a person can read (picked: names_keywords, posting_wording, profile_focus, strongest_remaining, room_left, only_evidence, shown_instead; left out: summary_other_variant, role_limit, role_dropped, project_limit, project_not_shown, education_detail, other_limit, cut_oldest_role_dropped, cut_oldest_role_shortened, cut_shown_by_recent_role, cut_lowest_value). skills lists every skill of the master the same way (posting_must, posting_nice, named_by_line; left out: not_asked, skills_limit; at most 28 shown). fits is false, and the text says so, when the pick is still over max_pages after every cut the rules allow. keywords carries the posting's must and nice keywords and which the resume names (must_covered, must_missing, nice_covered, nice_missing, must_missing_in_master); null without a job. markdown is the selection as resume markdown (--markdown prints only that; `gigai scout resume pdf --in` renders it). --evidence shows the evidence view instead (it needs a job): every role and degree heading, one summary, every skill and Other line, then the bullets most relevant to the posting, as many as fit in 12,000 characters (the assess prompt's cap); no page fit. selector_version names the weights and rules (sel-1). The same master, profile, posting and day give the same selection. No master yet: master_not_found. What this command shows is not stored: a profile's own selection is made and stored by 'gigai scout resume master selection refresh' (and by the migration, 'gigai scout resume master init'); assessing and tailoring a job still read the profile's resume. Output is the user's own text (user-private)."
    },
    "scout resume master selection status": {
      "summary": "Show each profile's selection of your master resume against the master as it is now, with the offer for new lines.",
      "effect": "read",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object: {ok, master: {revision, revision_id, parent_revision, written_by, updated_at, content_sha256, record_id, counts}, profiles: [{profile_id, label, state, has_selection, attached, source: migration | index | titles | refresh, selector_version, shown, skills, pins, excludes, master_revision, made_from_revision, new_lines, changed, retired, skills_retired, stale, offer}]}.",
      "examples": [
        "gigai scout resume master selection status --json",
        "gigai scout resume master selection status --profile profile_0a1b2c3d-0000-4000-8000-000000000001"
      ],
      "notes": "Local, no model call; nothing is written. A profile's selection is the ids of the master lines its resume shows; its resume (what every assessment, ranking and tailoring reads) is that selection's 2-page view. A selection is STICKY: it changes only when a line it shows is edited or retired in the master, or when you refresh. new_lines are the lines the master gained since the selection was made that it does not show; offer is the sentence for them ('3 new master lines: refresh?'), null when there are none. changed / retired / skills_retired are shown lines the master has since edited or no longer has; stale is true when the view does not say what the master says for them yet ('gigai scout resume master selection refresh --sync' prints it again; every command that writes the master does that itself). attached is false when the profile's resume was replaced by hand after the selection was made ('gigai scout resume add --profile'): the selection is then no longer what the profile shows, that resume is left alone, and only a refresh selects from the master again. has_selection false: the profile still owns its resume, as before the master. pins and excludes are stored with the selection; nothing sets them yet. No master yet: master_not_found."
    },
    "scout resume master selection refresh": {
      "summary": "Select again from your whole master resume for a profile and make the result its resume; its first selection when it has none.",
      "effect": "write",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object: {ok, dry_run, master: {revision, revision_id, parent_revision, written_by, updated_at, content_sha256, record_id, counts}, profiles: [{profile_id, label, action: first | refreshed | synced, source: index | titles | refresh | migration, written, resume_ref, shown, skills, pages, fits, added, removed, changed, retired, postings}]}.",
