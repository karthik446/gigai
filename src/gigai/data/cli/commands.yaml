    "scout answer": {
      "summary": "Answer one interview question once; the answer is reused across every posting.",
      "effect": "write",
      "external": "model",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai scout answer q-visa --answer-text \"I need H-1B sponsorship\"",
        "gigai scout answer cloud:gcp --question \"Have you run workloads on GCP?\" --answer-text \"Yes: two years of batch workloads.\" --profile profile_1 --json"
      ],
      "notes": "The answer goes into one profile's story bank (--profile; default: the profile the --reassess job was assessed for, else the selected profile) and is reused by that profile's later assessments, also when a posting words the question differently. --question keeps the question's own words with it; --actor agent records that an agent wrote it. An answer holding an email, phone, link, street address or the saved name is refused (personal_info_refused). --reassess JOB_URL_OR_ID re-runs the assessment with a model (external=model)."
    },
    "scout assess": {
      "summary": "Assess ONE job against a resume right now, without a find-jobs run.",
      "effect": "write",
      "external": "model",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai scout assess --job-url https://boards.greenhouse.io/acme/jobs/1 --resume resume.md --json"
      ],
      "notes": "Calls the configured model adapter (default from find-jobs.json). --job-url may fetch the posting over the network."
    },
    "scout discover": {
      "summary": "Run the weekly company-discovery engine (OpenAI web_search + H-1B baseline).",
      "effect": "write",
      "external": "network",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai scout discover --runs 3"
      ],
      "notes": "Foreground; can take 5-30 minutes. Calls OpenAI web_search (network + model) and needs credentials. --status only reads."
    },
    "scout install": {
      "summary": "Bind, approve, and activate Scout for the bound project; safe to rerun.",
      "effect": "write",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object, including \"stopped_server\" (always null for install).",
      "examples": [
        "gigai scout install"
