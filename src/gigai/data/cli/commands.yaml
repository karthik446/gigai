    "scout resume master init": {
      "summary": "Make your master resume: merged from the resumes your profiles hold, or from a resume FILE as you have it (contact lines removed, an id on every line); --dry-run shows either without writing.",
      "effect": "write",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object. With --from: {ok, status: created | revised | unchanged | dry_run, written, would: created | revised | unchanged (with --dry-run, else null), master: {revision, revision_id, parent_revision, written_by, updated_at, content_sha256, record_id, counts}, ids_assigned, ids_restored, changes: {added, removed, changed}, contact_removed: {removed: {kind: count}, lines: [{kind, line}], message, headings: [{kind: link, line, heading, where: heading | line_under_heading, message}] when a link was taken out of a heading that is kept} or null, source_lines: {the same shape as migration.source_lines, one entry in resumes with profiles: []} or null for a file in GigAI's own format, scout_installed, profiles: {synced: [{profile_id, label, action, changed, retired, resume_ref, shown, skills, pages}], offers: [{profile_id, label, new_lines, offer}]}, file: {name, path, state: current | changed, not_imported, revision, beside, written, wrote}}. Without --from (the merge of your profiles' resumes): {ok, mode: migration, status: needs_answers | dry_run | created | revised | unchanged, written, master (null until one is stored), migration: {resumes, lines_in, lines_out, entries, exact_duplicates, ids_assigned, near_duplicates: [{kept_id, kept, folded, similarity, profiles}], questions: [the same shape as questions, answered ones included], unanswered, source_lines: {in, kept, folded, left_out, folded_by_reason: {exact_duplicate, near_duplicate, conflict, same_entry, role_line, skills_joined}, left_out_by_reason: {contact, above_first_section, title_heading, unknown_section, empty_section, section_in_other, unread}, resumes: [{profiles, in, left_out: [{reason, why, lines}], sections: [{line, heading, section, how: name | closest | default, why}], read_as: [{how: entry_line | listed_entry | kept_in_other, why, lines}], education: [{first, last, section, message}]}]}}, questions: [{question_id, kind: number_conflict, question, section, entry, options: [{key: a | b, text, profiles}], choices: [a, b, both], answer}], profiles: [{profile_id, label, shown, skills, resume_ref}], contact_removed: [{profile, kind, line}] or null}.",
      "examples": [
        "gigai scout resume master init --json",
        "gigai scout resume master init --answer mq-1a2b3c4d5e6f=a --json",
        "gigai scout resume master init --dry-run",
        "gigai scout resume master init --from resume.md --dry-run",
        "gigai scout resume master init --from resume.md",
        "gigai scout resume master init --from master.md --revision 1 --as agent --json"
      ],
      "notes": "Local, no model call. WITHOUT --from it is the migration: the distinct resumes your profiles hold are merged into one master, newest first. An entry is the same entry when its heading and its role line (or its years) match; a line seen before is folded when it is the same line, and when it is a near-duplicate that states the same numbers (the newer wording is kept; each is listed in migration.near_duplicates); Skills lines with the same label are joined. Two versions of a line that state DIFFERENT numbers are a conflict and are asked, never guessed: status is needs_answers, questions lists each with its two wordings, and NOTHING is written. Run it again with one --answer QUESTION_ID=a|b|both per question (a: the newer resume's wording, b: the other, both: keep the two lines); an id that is no question is refused with migration_answer_unknown. --dry-run shows the merge and writes nothing. Each profile's first selection is its own old resume (the ids of the lines that came from it) and its resume is NOT rewritten: resume_ref in the output is the pin it had, so no assessment, rank score or tailored resume goes stale; old resume records are never deleted. A resume that is not in GigAI's format is read where its shape is plain (common section names, bold, underlined or capital headings, other bullet marks, a bold title line under an employer as its role line, a summary paragraph above the first section). Since 0.1.10.11: a horizontal rule (---, ***, ___) is a blank line; a section heading that is not one of the six is read as the closest of them, by its name (Work Experience, Technical Skills, Selected Projects, Open Source, Publications, Awards, Certifications, About), else by a word in it (Agentic AI Projects is Projects), else as Other, and each is listed in source_lines.resumes[].sections with its own words, the section and how (name, closest, default); a bold title with a tagline and a line under it is an entry; text that has no place in its section is kept and listed in source_lines.resumes[].read_as, never refused (entry_line: plain text under an entry beyond its role lines, or after its bullets, is a line of that entry; listed_entry: a list item in Education or Projects with no entry above it is an entry; kept_in_other: text or a list in an entry section with no entry above it is a line of Other). migration.source_lines counts every line of the resumes (not blank, not only a comment, not only a rule): in = kept + folded + left_out, and each left-out line is named by resume, reason and line number in the stored resume, never by its text, so read --dry-run before the first write; one that cannot be read is refused with migration_resume_unreadable, naming the profile, the line number and the rule, never the text (error.line is the number; the text output also shows that line of the stored resume under the message). Only profiles without a selection take part, so running it again is safe (status unchanged); with a master already stored their resumes are merged INTO it and --revision N is needed when that changes it. No profile yet: migration_no_profiles. WITH --from: FILE (.md, .markdown, .txt, at most 1 MiB) is stored as the master. A resume as you have it is read by the same reader as the migration's (rules, other section names, bold or plain entries, a summary paragraph above the first section; a name, a title and a headline above it are left out), and source_lines says what became of every line: kept, or left out by line number and reason, with the headings read as another section (sections) and the lines kept where they had no place (read_as). Since 0.1.11.4 both forms also say when lines LOOK like education and did not become an Education entry, if the master they give has no Education entry at all: source_lines.resumes[].education lists each block by its first and last line number and the section that holds it (a line under a heading that names education with no school above it; a bold line or a deeper heading that is only the word Education inside another section, with the lines under it; a degree such as B.S., BA, MS, MBA, PhD, Bachelor of or Master of with University, College or Institute and a year, on one line or on lines that touch), with the sentence the text output prints (education: lines 31-32 of your file were kept in Other, not as a degree) and never the text. It is a report only: what is stored is the same, no entry is made up, and a resume that gave an Education entry reports nothing; add the degree with `gigai scout resume master add --heading SCHOOL --role \"DEGREE | YEAR\" --section education`. A file whose first line is <!-- gigai-master:1 --> is in GigAI's own format (## Summary, ## Experience with ### entries and - bullets, ## Skills, ## Education, ## Projects, ## Other) and is held to it: source_lines is null, and a line that breaks the format is refused. Every line may end in <!-- id:ID tags:a,b backed:story:ID -->; a line without an id gets one, and an id never changes when its text is edited. A line whose id comment was deleted gets its id back when its text still matches. --dry-run goes through every check a write goes through (master_exists, revision_conflict, the format) and writes nothing: status is dry_run, would says what a write would do, master is what would be stored (revision_id and updated_at are null until it is), no profile's resume is printed again, and Scout is not set up by it. A line that looks like contact data (name, email, phone, link, address: the resume import's own detector) is not imported; contact_removed names it by kind and line number, never by value (null when there was none). The master is one record with a revision per change: with a master already stored, pass --revision N (the revision you read with show --json) and the file becomes revision N+1; without it the write is refused with master_exists, and with a revision that is no longer the current one with revision_conflict (both carry current, the revision the master is at). The same content again writes nothing (status unchanged). A file that does not read as a master is refused with master_markdown_invalid, naming the line number and the rule, never the line's text (error.line is the number; the text output also shows that line of FILE under the message); the stored master stays as it was. --as agent (also --actor agent) records that an agent wrote the revision. Works as the very first command on a fresh machine, as 'gigai scout resume add' does. After a write, a profile whose selection shows a line this revision edited or retired gets its resume printed again from the same lines (profiles.synced), and lines the master gained are offered, never added (profiles.offers: '3 new master lines: refresh?'). --answer belongs to the form without --from. A link in a heading (0.1.10.11, both forms): in an entry's heading, a bold title line, or a role line right under one, a markdown link keeps its words and loses its address ('### [Driftwatch](https://...)' is the entry Driftwatch, with its bullets), and an address written out goes while the rest of the line stays; contact_removed.headings lists each by line number and the heading's words (--dry-run shows them). A heading that is only a link (also a dotted name alone, such as driftwatch.ai) is refused with master_markdown_invalid, by line number: give the project a name. A link in any other line (a bullet, a paragraph), and an email or a phone number in a heading, are handled as before: the line is not imported and is named by line number and kind. No link is stored."
    },
