    "layout migrate": {
      "summary": "Migrate one existing clean workpad to the authenticated v2 layout.",
      "effect": "write",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai layout migrate --gig scout"
      ]
    },
    "models": {
      "summary": "Show model discovery; optionally run one explicit readiness probe.",
      "effect": "write",
      "external": "model",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai models --json"
      ],
      "notes": "--refresh re-captures the local runtime discovery snapshot (writes). --probe TARGET makes one bounded readiness call to that target (external=model)."
    },
    "occurrence close": {
      "summary": "Close a terminal occurrence without creating another Run.",
