    "scout resume master init": {
      "summary": "Make your master resume: merged from the resumes your profiles hold, or from a resume markdown FILE (contact lines removed, an id on every line).",
      "effect": "write",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object. With --from: {ok, status: created | revised | unchanged, master: {revision, revision_id, parent_revision, written_by, updated_at, content_sha256, record_id, counts}, ids_assigned, ids_restored, changes: {added, removed, changed}, contact_removed, scout_installed, profiles: {synced: [{profile_id, label, action, changed, retired, resume_ref, shown, skills, pages}], offers: [{profile_id, label, new_lines, offer}]}}. Without --from (the merge of your profiles' resumes): {ok, mode: migration, status: needs_answers | dry_run | created | revised | unchanged, written, master (null until one is stored), migration: {resumes, lines_in, lines_out, entries, exact_duplicates, ids_assigned, near_duplicates: [{kept_id, kept, folded, similarity, profiles}], questions: [the same shape as questions, answered ones included], unanswered}, questions: [{question_id, kind: number_conflict, question, section, entry, options: [{key: a | b, text, profiles}], choices: [a, b, both], answer}], profiles: [{profile_id, label, shown, skills, resume_ref}], contact_removed: [{profile, kind, line}] or null}.",
      "examples": [
        "gigai scout resume master init --json",
        "gigai scout resume master init --answer mq-1a2b3c4d5e6f=a --json",
        "gigai scout resume master init --dry-run",
        "gigai scout resume master init --from master.md",
        "gigai scout resume master init --from master.md --revision 1 --as agent --json"
      ],
      "notes": "Local, no model call. WITHOUT --from it is the migration: the distinct resumes your profiles hold are merged into one master, newest first. An entry is the same entry when its heading and its role line (or its years) match; a line seen before is folded when it is the same line, and when it is a near-duplicate that states the same numbers (the newer wording is kept; each is listed in migration.near_duplicates); Skills lines with the same label are joined. Two versions of a line that state DIFFERENT numbers are a conflict and are asked, never guessed: status is needs_answers, questions lists each with its two wordings, and NOTHING is written. Run it again with one --answer QUESTION_ID=a|b|both per question (a: the newer resume's wording, b: the other, both: keep the two lines); an id that is no question is refused with migration_answer_unknown. --dry-run shows the merge and writes nothing. Each profile's first selection is its own old resume (the ids of the lines that came from it) and its resume is NOT rewritten: resume_ref in the output is the pin it had, so no assessment, rank score or tailored resume goes stale; old resume records are never deleted. A resume that is not in GigAI's format is read where its shape is plain (common section names, bold or capital headings, other bullet marks); one that cannot be read is refused with migration_resume_unreadable, naming the profile, the line number and the rule, never the text. Only profiles without a selection take part, so running it again is safe (status unchanged); with a master already stored their resumes are merged INTO it and --revision N is needed when that changes it. No profile yet: migration_no_profiles. WITH --from: --from takes resume markdown in GigAI's format (## Summary, ## Experience with ### entries and - bullets, ## Skills, ## Education, ## Projects, ## Other), at most 1 MiB; a first line <!-- gigai-master:1 --> names the format. Every line may end in <!-- id:ID tags:a,b backed:story:ID -->; a line without an id gets one, and an id never changes when its text is edited. A line whose id comment was deleted gets its id back when its text still matches. Whatever stands above the first ## section is never stored. A line that looks like contact data (name, email, phone, link, address: the resume import's own detector) is not imported; contact_removed names it by kind and line number, never by value (null when there was none). The master is one record with a revision per change: with a master already stored, pass --revision N (the revision you read with show --json) and the file becomes revision N+1; without it the write is refused with master_exists, and with a revision that is no longer the current one with revision_conflict (both carry current, the revision the master is at). The same content again writes nothing (status unchanged). A file that does not read as a master is refused with master_markdown_invalid, naming the line number and the rule, never the line's text; the stored master stays as it was. --as agent (also --actor agent) records that an agent wrote the revision. Works as the very first command on a fresh machine, as 'gigai scout resume add' does. After a write, a profile whose selection shows a line this revision edited or retired gets its resume printed again from the same lines (profiles.synced), and lines the master gained are offered, never added (profiles.offers: '3 new master lines: refresh?'). --answer and --dry-run belong to the form without --from."
    },
    "scout resume master history": {
      "summary": "List your master resume's revisions, newest first: who wrote each, when, and what it changed.",
      "effect": "read",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object: {ok, revision, revisions: [{revision, revision_id, parent_revision, written_by, updated_at, content_sha256, items, entries, added, removed, changed}]}.",
      "examples": [
