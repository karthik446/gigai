mployer, title, dates) must be a resume line, unchanged. The job is then put through the pipeline: the tailor step keeps an edited resume, and the re-assessment (one model call), the Scout ATS score and the Scout label are made again from it; a job with no assessment yet is stored and reported as not checked (assessment_missing). Background tailoring never replaces an edited resume; running this command without --in does. --in is the old spelling of 'gigai scout resume store --in FILE --job-url URL': it does what that command does (see it for the check and --resolves) and names the new spelling in one line (stderr; 'renamed' in --json)."
