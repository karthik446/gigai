    "history": {
      "summary": "List committed journal transitions for one Gig in sequence order.",
      "effect": "read",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai history scout"
      ]
    },
    "init": {
      "summary": "Initialize the package boundary and recoverable default instances.",
      "effect": "write",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai init --confirm"
      ]
    },
    "internal eval behavior": {
      "summary": "Score separately supplied Solver observations against a Case corpus (developer only).",
      "effect": "write",
      "external": "none",
      "output": "Human-readable text.",
      "examples": [
        "gigai internal eval behavior --manifest m.json --observations o.json --split development"
      ],
      "hidden": true,
      "hiddenReason": "Developer-only command retained outside the public CLI surface (group `internal` is hidden)."
    },
    "internal eval contract": {
      "summary": "Validate a versioned behavioral evaluation manifest (developer only).",
      "effect": "read",
      "external": "none",
