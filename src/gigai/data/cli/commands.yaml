      "notes": "Local, no model call; nothing is written. A profile's selection is the ids of the master lines its resume shows; its resume is that selection's 2-page view. tailoring_basis says what a resume for a job is made from for the profile, by the one rule every reader and every text follows: master (the job's candidate lines of the whole master: every profile, one with no selection too, its titles then being the guide) or profile_resume (the profile's own resume: only when it was replaced by hand after the selection was made); tailoring_basis_line is the sentence for it, which the text output prints for each profile. A selection is STICKY: it changes only when a line it shows is edited or retired in the master, or when you refresh. new_lines are the lines the master gained since the selection was made that it does not show; offer is the sentence for them ('3 new master lines: refresh?'), null when there are none. changed / retired / skills_retired are shown lines the master has since edited or no longer has; stale is true when the view does not say what the master says for them yet ('gigai scout resume master selection refresh --sync' prints it again; every command that writes the master does that itself). attached is false when the profile's resume was replaced by hand after the selection was made ('gigai scout resume add --profile'): the selection is then no longer what the profile shows, that resume is left alone, and only a refresh selects from the master again. has_selection false: the profile still owns its resume, as before the master, and a resume for a job is picked from the master all the same (tailoring_basis master). pins and excludes are stored with the selection; nothing sets them yet. No master yet: master_not_found."
    },
