      "notes": "Works as the very first command on a fresh machine: writes the default GigAI settings (like 'gigai scout run'), installs Scout if needed, then imports the file. Never rewrites an existing config. The name and contact lines (email, phone, address, links) are removed and discarded before the resume is stored; --json carries contact_removed {removed: {kind: count}, message} (null when there were none)."
    },
    "scout resume pdf": {
      "summary": "Render a resume to PDF locally: your own markdown, or a stored tailored resume.",
      "effect": "read",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object: {ok, out_path, source, pages, bytes, spacing_scale, header, finish_url, scout_running}.",
      "examples": [
        "gigai scout resume pdf --in resume.md --json",
        "gigai scout resume pdf --in resume.md --out resume.pdf --spacing 0.9",
        "gigai scout resume pdf --tailored --job-url https://boards.greenhouse.io/acme/jobs/1 --json"
      ],
      "notes": "No model call and no network: the markdown is only rendered, never stored. --in takes resume markdown in GigAI's format (## Summary, ## Experience with ### entries and - bullets, ## Skills, ## Education, ## Projects, ## Other; trailing <!-- ... --> comments are dropped), so the markdown of a tailored resume renders as it is. The PDF has no header (no name or contact line; a blank block keeps the page layout): finish_url is the local Scout page (#/pdf) where the person types their details in the Generate PDF form and downloads; an agent cannot finish that step unless it drives that person's browser. --spacing (0.7-1.4) and --auto-fit/--no-auto-fit change the layout for this render only; --spacing alone turns auto fit off. Writes only the PDF: --out, else <company>-<role>-<YYYY-MM-DD>.pdf (resume-<YYYY-MM-DD>.pdf for --in) in the current folder. To change two bullets and render: edit the two lines in the markdown file and run the first example; for a stored tailored resume, change the lines with PUT /api/tailored-resumes/lines (use: custom) and run the --tailored example."
    },
