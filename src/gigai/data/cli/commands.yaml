    "scout resume master selection show": {
      "summary": "Show which lines of your master resume a resume would show for a profile or one job, and why: Picked / Left out.",
      "effect": "read",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object: {ok, selection: {selector_version, max_bullets, over_cap: [the ids left out as over the cap, the first left out first], max_pages, pages, pages_before_fit, last_page_fill, fits, layout_queries (informational since sel-7: no page is counted, so pages and pages_before_fit are null, fits true, cut_for_length empty), counts: {picked, left_out, bullets, skills, skills_left_out, cut_for_length, conflicts}, summary, entries: [{id, section, heading, sublines, shown, heading_only, picked, left_out}], picked: [{id, section, kind, entry_id, text, code, reason}], left_out: [the same], skills: {picked: [{name, code, reason}], left_out: [the same]}, cut_for_length: [{id, kind, code, reason}], added_to_fill, only_evidence: [], shown_instead: [] (both always empty since sel-2), roles_dropped, earlier (the roles listed by their heading alone), requirements: [{id, text, mandatory, supporters, cited, shown}], evidence_for: [{id, requirements}], conflicts: [{kind, ids, reason, requirement_id, requirement, covered}], title_entries: [{id, line, shown}], keywords, master: {revision, revision_id, parent_revision, written_by, updated_at, content_sha256, record_id}, profile, job, markdown}}. With --evidence: {ok, evidence: {selector_version, cap, chars, within_cap, bullets, bullets_total, summary, entries, skills, other, markdown, master, profile, job}}.",
      "examples": [
        "gigai scout resume master selection show --json",
        "gigai scout resume master selection show --job-url https://boards.greenhouse.io/acme/jobs/1 --json",
        "gigai scout resume master selection show --profile-title \"Staff AI Engineer\" --focus ai --job-text posting.txt --title \"Staff AI Engineer\" --json",
        "gigai scout resume master selection show --job-text posting.txt --title \"Staff AI Engineer\" --evidence"
      ],
      "notes": "Local, code only: no model call and no request; the selection is not stored. Without a job it is the profile's standing pick; with --job-url or --job-text it is the pick for that posting, made from the WHOLE master. --job-url reads a posting Scout already holds (the index, else the text a stored assessment was made on) by its URL or job identity; one it does not hold is refused with job_not_stored (pass --job-text FILE, or - for stdin, with --title and --company). --profile ID takes a stored profile's titles (default: the selected profile, resolved as every Scout command resolves it; none stored: no profile prior, profile is null); --profile-title T (repeatable) and --focus TAG (repeatable, a tag of the master's lines) select for titles without a stored profile. The rules (the order of what a pick is for; a later one never buys back an earlier one): 1. every MANDATORY requirement of the posting that the master can support keeps a supporting line. The requirements are the posting's list lines (a line under a nice-to-have heading is not mandatory) and every must-have keyword; a line supports one when it names a keyword the requirement names or shares enough of its words (requirements lists each with its supporters, strongest first, and which of them are shown). When the job named by --job-url has a stored assessment for the profile, coverage comes from that assessment instead of from shared words: each of its requirement rows that cites lines of the master is a requirement (ids r1, r2, ... by its place in the assessment; cited is true) whose supporters are exactly the lines it cites, every such row keeps one of them, a met mandatory row's line is the last one the cap could leave out, and a line or keyword of the posting that such a row is about is not matched by words at all; matching by words then only adds support for what no cited row is about. 2. The line kept for a requirement is its strongest (a line backed by a story or an answer, then one that states a number, then a plain one, among the lines that support it about equally well): that line is the requirement's evidence (evidence_for) and is not left out while anything else can go. 3. A profile's pinned lines are left out only after everything else but a requirement's evidence. 4. How recent a role is only breaks ties: an older role's line that is the evidence of a requirement stays while recent lines that support nothing the posting asks for are left out. THE CAP (sel-7, 0.1.11.5): a selection shows its best lines, at most 20 bullets under its roles and projects (max_bullets), and that is its only limit: NO PAGE IS COUNTED, nothing is laid out and no room is kept for a header. How many pages it prints on is yours to settle with the spacing of the job's preview (a pick that prints on 3 pages at its automatic spacing is a good pick). Still held: no project printed without a line, roles in date order, every recent role present with at least its best line; a role is old when it ended more than 8 years ago, shows at most 3 lines, and one with no line shown is listed by its heading. The summary, the Other lines, the Skills section and every degree do not count toward the cap. When the pick holds more than the cap, lines are left out lowest value first (over_cap): lines that add nothing the posting asks for (those the profile does not show first, then very long ones, the weakest, the oldest), then a third line for a requirement, then a second; a line that is a requirement's evidence is never left out for a better-scored line that is not one. A pick under the cap takes the best lines not shown (added_to_fill), so a master with fewer than 20 candidate bullets shows them all. What the posting's TITLE names stays longer (sel-4): the title's words without rank, place or level say what the job is about, and a role or project is named by it when its heading or its own title holds one of those words, or half of its lines do (title_entries lists each with its best line and whether it is shown). Such an entry is never dropped whole while anything but a requirement's evidence or a pin can go: its best line is left out last of all other lines (every other old role and project goes first, and every recent role is down to one line). Among the lines that add nothing a requirement lacks, the lines of such an entry that hold a word of the title stay longest, whatever the profile shows; and, when the job has a stored assessment, a line that supports by words a line of the posting the assessment already answered with another line stays before a stronger or more recent line that is about nothing the posting says. The Skills section is always kept whole (what the posting asks for first, matched inside a group such as Python/Go/TypeScript, then the rest by name); no skill is cut. conflicts is what the cap kept out although the rules say it stays, never silently: mandatory_evidence (a requirement's strongest line is not shown; covered says whether a weaker line still covers it), must_keep (a pinned line is not shown), title_entry (no line is shown of a role or project the posting's title names; ids holds the entry and its best line). (earlier_roles and over_budget came from the page limit and are no longer made.) A line that says what a better line says is left out (near_duplicate). The same lines in another order in the master give the same selection. Nothing is reworded: every shown line is a master line, by id. picked and left_out together hold every summary, bullet and Other line of the master once, each with a stable code and a reason a person can read (picked: requirement_evidence, pinned, title_entry, names_keywords, posting_wording, posting_title, profile_focus, general, strongest_remaining, summary_variant, room_left; left out: summary_other_variant, near_duplicate, role_limit, role_dropped, project_limit, project_not_shown, education_detail, other_limit, over_cap, cut_conflict). skills lists every skill of the master the same way (posting_must, posting_nice, named_by_line, listed). keywords carries the posting's must and nice keywords and which the resume names (must_covered, must_missing, nice_covered, nice_missing, must_missing_in_master); null without a job. markdown is the selection as resume markdown (--markdown prints only that; `gigai scout resume pdf --in` renders it). --evidence shows the evidence view instead (it needs a job): every role and degree heading, one summary, every skill and Other line, then the bullets most relevant to the posting, as many as fit in 12,000 characters (the assess prompt's cap); no page fit. selector_version names the rules (sel-7, 0.1.11.5: the selection is by score up to 20 bullets and knows no page limit; sel-6, 0.1.11.4: a role none of whose lines is shown is still listed, as one line (title, employer, dates) under 'Earlier experience' at the end of the Experience section, newest first, so no employer is dropped silently; sel-2 to sel-6 fitted the pick to 2 pages, sel-5 with room for the PDF's header; sel-4, 0.1.10.11: a role or project the posting's title names keeps its best line, and what is left of the pick goes to lines about the posting before stronger or more recent ones; sel-3 took coverage from a stored assessment's cited lines; sel-1 cut the oldest roles first and then by a score). The same master, profile, posting and day give the same selection. No master yet: master_not_found. What this command shows is not stored: a profile's own selection is made and stored by 'gigai scout resume master selection refresh' (and by the migration, 'gigai scout resume master init'); assessing and tailoring a job still read the profile's resume. Output is the user's own text (user-private)."
    },
