    "occurrence compare": {
      "summary": "Compare one completed occurrence with its explicitly named prior occurrence.",
      "effect": "read",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai occurrence compare occ-2 --prior-occurrence occ-1"
