      "summary": "Show each profile's selection of your master resume against the master as it is now, with the offer for new lines.",
      "effect": "read",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object: {ok, master: {revision, revision_id, parent_revision, written_by, updated_at, content_sha256, record_id, counts}, profiles: [{profile_id, label, state, has_selection, attached, source: migration | index | titles | refresh, selector_version, shown, skills, pins, excludes, master_revision, made_from_revision, new_lines, changed, retired, skills_retired, stale, offer, tailoring_basis: master | profile_resume, tailoring_basis_line}]}.",
