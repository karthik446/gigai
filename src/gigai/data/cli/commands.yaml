      ],
      "notes": "The default profile uses the setup settings (location, work mode, countries, posted window); every other profile has its own, or the default's when it has none. The first read of a project stores its default profile."
    },
    "scout profile update": {
      "summary": "Set a profile's own location, work mode, countries and posted window.",
      "effect": "write",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai scout profile update profile_1 --location \"Houston, TX\" --work-mode hybrid --country US --max-age-days 30",
        "gigai scout profile update profile_1 --same-as-default"
      ],
      "notes": "Only the options given change; no other profile is changed. The default profile is refused: it uses the setup settings (Settings in the Scout UI). The location is a search setting, not the resume's contact line."
    },
    "scout resume add": {
      "summary": "Import a file as the resume reference and create the record find-jobs reads.",
      "effect": "write",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai scout resume add resume.md"
      ],
      "notes": "Works as the very first command on a fresh machine: writes the default GigAI settings (like 'gigai scout run'), installs Scout if needed, then imports the file. Never rewrites an existing config."
    },
    "scout resume pdf": {
      "summary": "Render a resume to PDF locally: your own markdown, or a stored tailored resume.",
      "effect": "read",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object: {ok, out_path, source, pages, bytes, spacing_scale}.",
      "examples": [
        "gigai scout resume pdf --in resume.md --out resume.pdf --json",
        "gigai scout resume pdf --in resume.md --out resume.pdf --profile profile_1 --spacing 0.9",
        "gigai scout resume pdf --tailored --job-url https://boards.greenhouse.io/acme/jobs/1 --out acme.pdf --json"
      ],
      "notes": "No model call and no network: the markdown is only rendered, never stored. --in takes resume markdown in GigAI's format (## Summary, ## Experience with ### entries and - bullets, ## Skills, ## Education, ## Projects, ## Other; trailing <!-- ... --> comments are dropped), so the markdown of a tailored resume renders as it is. The PDF header (name, title, contact line) always comes from the saved Resume display settings, never from the markdown. --spacing (0.7-1.4) and --auto-fit/--no-auto-fit change the layout for this render only; --spacing alone turns auto fit off. Writes only --out. To change two bullets and render: edit the two lines in the markdown file and run the first example; for a stored tailored resume, change the lines with PUT /api/tailored-resumes/lines (use: custom) and run the --tailored example."
    },
    "scout resume tailor": {
      "summary": "Tailor a resume to ONE job posting right now: markdown, every line sourced.",
      "effect": "write",
      "external": "model",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai scout resume tailor --job-url https://boards.greenhouse.io/acme/jobs/1 --resume resume.md --out tailored.md"
      ],
      "notes": "Calls the configured model adapter; name and contact lines are removed before the model sees the resume text. --job-url may fetch the posting."
    },
    "scout run": {
      "summary": "Install/activate Scout if needed, then start (or reuse) its local API + UI.",
      "effect": "write",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object, including \"stopped_server\": {pid, home, target} for a verified older Scout server that was stopped to free the port, else null.",
      "examples": [
        "gigai scout run --no-browser"
      ],
      "notes": "Serves on localhost only. Once running, GET /api describes the HTTP API."
    },
    "scout snapshot export": {
      "summary": "Write a metadata-only snapshot of the stored company index (postings, title tags, board validators) and print the gh commands to publish it.",
      "effect": "write",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai scout snapshot export --out ./snapshot",
        "gigai scout snapshot export --out ./snapshot-next --base ./snapshot/manifest.json"
      ],
      "notes": "No descriptions and no private paths are written (scanned before success); every file is re-opened and its SHA-256 checked. With --base, a delta file and a removal list of boards and postings that are gone are added. Never publishes: the gh commands are printed as text for you to run."
    },
    "scout snapshot import": {
      "summary": "Download the published metadata snapshot (postings, title tags, board validators; no descriptions) and add it to the stored company index.",
      "effect": "write",
      "external": "network",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai scout snapshot import",
        "gigai scout snapshot import --from ./snapshot"
      ],
      "notes": "Takes the full files, or only the delta when the stored snapshot is the delta's base. Every file's SHA-256 is checked before it is read. A board checked on this machine at or after the snapshot is left alone, and nothing local is deleted except boards the snapshot itself added and later lists as removed. Unreachable or not published is a quiet no-op (exit 0); a snapshot that fails its checks or cannot be written exits 1 with the stored postings unchanged. Makes no request when the snapshot.enabled setting (or GIGAI_SCOUT_SNAPSHOT=0) turns it off."
    },
    "scout snapshot status": {
      "summary": "Show which snapshot is in use, the last import attempt and whether the download is turned on.",
      "effect": "read",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai scout snapshot status"
      ]
    },
    "scout sources status": {
      "summary": "Show the last sources update and whether a search can use the stored postings.",
      "effect": "read",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai scout sources status"
      ]
    },
