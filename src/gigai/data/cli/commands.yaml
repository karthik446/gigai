      "notes": "No model call and no network: the markdown is only rendered, never stored. --in takes resume markdown in GigAI's format (## Summary, ## Experience with ### entries and - bullets, ## Skills, ## Education, ## Projects, ## Other; trailing <!-- ... --> comments are dropped), so the markdown of a tailored resume renders as it is. The PDF has no header (no name or contact line; a blank block keeps the page layout): finish_url is the local Scout page (#/pdf) where the person types their details in the Generate PDF form and downloads; an agent cannot finish that step unless it drives that person's browser. --spacing (0.7-1.4) and --auto-fit/--no-auto-fit change the layout for this render only; --spacing alone turns auto fit off. Writes only the PDF: --out, else <company>-<role>-<YYYY-MM-DD>.pdf (resume-<YYYY-MM-DD>.pdf for --in) in your resumes folder ('gigai scout resume folder'; ~/Documents/GigAI/resumes by default), never the current directory; out_path is that path as you type it (~/...). The resumes folder never holds contact details and never replaces a file you changed (the new PDF gets the next free name, ...-2.pdf): markdown whose printed text has an email, a phone number or a profile link is refused there (contact_data_found) and needs --out FILE. To change two bullets and render: edit the two lines in the markdown file and run the first example; for a stored tailored resume, change the lines with PUT /api/tailored-resumes/lines (use: custom) and run the --tailored example."
