      "notes": "Local, no model call. The master resume is the one document that holds every role, bullet, project and skill, one per Scout home, with an id on every line and no contact data. kind is summary, bullet, skills or other (a certification is an Other line); a skills line also carries label and skills. strength is derived, never typed: backed (a story or an answer is linked), quantified (the line states a number) or stated. mark is 16 hex characters over the id and the text: it changes when the text does. written_by (operator or agent) and source say who wrote a line's text with 'gigai scout resume master add' or 'edit' and where its evidence came from; both are null for a line that came with a file or that a file import has since changed. A Skills line carries skill_sources instead: {name, written_by, source, updated_at, backed} for each skill a write added. --section and --entry narrow entries and items; counts always describe the whole master. --revision N shows an earlier revision (revisions is how many there are). A master with no Education entry says so in the text output (0.1.11.4: 'Your master has no education.', with the command that adds a school: `gigai scout resume master add --heading SCHOOL --role \"DEGREE | YEAR\" --section education`); nothing is said once it has one, or when --section or --entry narrows the output to something else. --retired lists instead every line and entry an earlier revision holds and the master no longer does (removed with 'gigai scout resume master remove' or dropped by a file import), the last retired first: kind is entry or the line's kind, text is the line's text (an entry's heading), last_revision is the newest revision that still holds it, retired_in and retired_by the revision that dropped it and who wrote that one; 'gigai scout resume master add --restore ID' puts one back. file says how master.md in your resumes folder stands against the stored master (GigAI writes the master there after every change): not_imported true means the file has changes that are not in the master yet ('gigai scout resume master sync' imports them; the text output says so in its last line), revision is the revision GigAI last wrote into it, behind whether the master moved on since, beside the file that holds the newer revision meanwhile. No master yet: master_not_found. Output is the user's own text (user-private)."
