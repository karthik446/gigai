      "notes": "Local, no model call. GigAI writes your master into your resumes folder (default ~/Documents/GigAI/resumes; 'gigai scout resume folder') as master.md after every change of it, and NEVER reads that file by itself: an edit you make there is imported only by this command (or by Import the file on Scout's Master page). Until then 'gigai scout status' and 'gigai scout resume master show' say that master.md has changes not imported yet. status imported: the file is the master's next revision, with the rules of 'master init --from FILE': a line without an id gets one (ids.assigned), a line keeps its id, also when you deleted the id comment and left the text (ids.restored), and a line the file no longer holds is retired (retired; 'gigai scout resume master add --restore ID' puts it back). added, changed and retired list the lines by id with their text. master.md is then written again with every id, unless you saved it again meanwhile. status unchanged: the file says what the master holds. status written: master.md was not in the folder (or held an earlier revision, untouched), so it was written and nothing was imported. REFUSED, with nothing imported and the file left as it is: a file that does not read as a master (master_markdown_invalid names the line, never its text); a name line, an email, a phone number, a link or an address in it (personal_info_refused, by line number and kind: GigAI stores no contact details, and unlike 'init --from' the line is not dropped silently; since 0.1.10.11 a link in an entry's heading or title line is not refused: the link goes, the heading keeps its words, and contact_removed.headings says so by line number, while a heading that is only a link is master_markdown_invalid, by line number); a master that changed in Scout or through your agent since GigAI wrote the file (revision_conflict; current carries the revision it is at): importing would retire what was added since, so read both, then pass --revision N (the current revision) to import the file as it is; and a master.md GigAI never wrote (revision_required: the same --revision imports it). While master.md holds changes that are not imported, GigAI never replaces it: a change of the master made elsewhere is written beside it as master-2.md (file.wrote, file.beside), and the command that made it says so. --as agent (also --actor agent) records that an agent ran the import; an agent runs it only when the user asks, and reads the master with 'master show --json', never from the file. After an import, a profile whose resume shows an edited or retired line gets its resume printed again (profiles.synced) and new lines are only offered (profiles.offers). No master yet: master_not_found."
