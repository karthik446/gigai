        "gigai scout snapshot import --from ./snapshot"
      ],
      "notes": "Takes the full files, or only the delta when the stored snapshot is the delta's base. Every file's SHA-256 is checked before it is read. A board checked on this machine at or after the snapshot is left alone, and nothing local is deleted except boards the snapshot itself added and later lists as removed. Unreachable or not published is a quiet no-op (exit 0); a snapshot that fails its checks or cannot be written exits 1 with the stored postings unchanged. Makes no request when the snapshot.enabled setting (or GIGAI_SCOUT_SNAPSHOT=0) turns it off."
