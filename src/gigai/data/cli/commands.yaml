      ],
      "notes": "JOBS are posting URLs; without them the filter (--query, --state, --window, as gigai scout jobs list) selects the postings. What a run's assess step did, without a run. Nothing is assessed without approval: without --yes the answer is status ask with the count per profile and the estimate from the recorded model calls, and no model call is made; in a terminal the command then asks and waits for y or n. --yes approves: the batch is recorded (approval: its id, who approved with --actor, how many) and each posting is assessed for the profile it fits best (or --profile), one model call each, from the posting text already stored (a posting with none has its description fetched from its public board first, one request for it alone). 50 AT A TIME: one approval assesses the TOP 50 of them BY RANK and never more (the best rank score first; a posting not ranked yet after the ranked ones, the newest first by the day the posting went up, else the day Scout first stored it); the question says the total and the 50 (\"Assess the top 50 by rank of 120 postings? ~50 calls ... (70 more after these 50)\"), question.batch / more_after and counts.batch / more_after say it in numbers, and the same command again assesses the next 50. While a batch runs the pipeline and the rank lane start nothing, and a second batch is refused (assess_batch_running). A posting whose assessment is current is left out unless --again. A posting whose rank score is below fit.assess_min_rank (50; one not ranked yet is not) is left out too and counted (counts.low_rank_skipped); low_rank is the separate question for those (\"3 low-ranked ones are skipped (rank below 50); assess those too? ~3 calls\") and --include-low-rank puts them in the pool (still 50 per approval). status is then assessed (assessed.failed lists what could not be assessed, by error code) or nothing_to_assess. NO OUTPUT MIXES: posting text only, nothing you wrote. WHAT ONE ASSESSMENT SENDS. One assessment sends to your model target: the stored posting; your resume (the lines of your master resume picked for the posting, or the profile's own resume) with its contact lines removed by pattern; your search preferences (sponsorship, countries, location, titles, work mode); your saved answers; and the saved stories that match the posting. Pattern removal can miss an unusual name or contact format, so it is not a guarantee. A profile id is not contact data. With codex_cli or claude_cli the model target is your own login. The status ask answer says it for the postings asked about, in model_input_summary: {schema_version, postings, model_calls, model_target, model_target_runs: local | own_login | api_key, profiles: [{profile_id, label, postings, resume_source: profile_view | master_evidence}], sends, search_preferences, contact_lines, answers_used, answers_saved, stories_used, stories_saved, public_fetch_needed, public_fetch_postings}. It holds ids, labels, counts and names, never a line of your text; no model call is made for it; it is null once the batch ran. In a terminal the same facts are printed above the y/n question. APPROVALS. Three approvals are separate: the user's choice to assess; Scout's own --yes (approve: true over the API); and the agent runtime's own sandbox or model-provider approval. --yes does not bypass the runtime's policy, and an API or UI route is not a workaround: an agent whose runtime refuses the command quotes the refusal and asks the user for the exact missing authorisation. FAILURES. An item of assessed.failed whose error_code is model_target_unavailable, model_denied, model_unavailable, assess_timeout, model_output_invalid or assessment_not_stored also says model_call_started, may_have_used_tokens, fresh_assessment_stored (always false) and next_action; the text output prints them once per cause. After an interruption (a timeout, a killed command), read the posting's row first (gigai scout jobs list --query WORDS --json: assessment.assessed_at and stale_reason): a newer assessed_at with stale_reason null means it finished, and assessing again would be a second model call. CANCEL. --cancel (from another terminal, or for a batch the Jobs page started) stops the batch that is running: no further model call starts, the calls in flight finish, every assessment already stored is kept, and the batch's answer says assessed.stopped cancelled with assessed.not_started; the same command again takes the rest. It answers {schema_version, cancel_requested, running, batch} and assesses nothing. --include-low-rank puts the low-ranked postings in the pool: one approval is still the top 50 by rank of the whole pool, and low_rank.included says what that would change (pool, batch, low_ranked_in_batch, changes_batch)."
    },
    "scout jobs import-runs": {
      "summary": "Import what old find-jobs runs assessed into the stored postings' read model, once per run.",
      "effect": "write",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object: {schema_version, runs, runs_imported, runs_already_imported, runs_not_finished, runs_unreadable, assessments_imported, ephemeral_assessments, rows_skipped, values_dropped, by_profile, imported} (what POST /api/runs/import answers).",
      "examples": [
