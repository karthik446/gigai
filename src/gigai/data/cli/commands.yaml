      "notes": "No model call and no network: the markdown is only rendered, never stored. --in takes resume markdown in GigAI's format (## Summary, ## Experience with ### entries and - bullets, ## Skills, ## Education, ## Projects, ## Other; trailing <!-- ... --> comments are dropped), so the markdown of a tailored resume renders as it is. The PDF has no header (no name or contact line; a blank block keeps the page layout): finish_url is the local Scout page (#/pdf) where the person types their details in the Generate PDF form and downloads; an agent cannot finish that step unless it drives that person's browser. --spacing (0.7-1.4) and --auto-fit/--no-auto-fit change the layout for this render only; --spacing alone turns auto fit off. Writes only the PDF: --out, else <company>-<role>-<YYYY-MM-DD>.pdf (resume-<YYYY-MM-DD>.pdf for --in) in your resumes folder ('gigai scout resume folder'; ~/Documents/GigAI/resumes by default), never the current directory; out_path is that path as you type it (~/...). The resumes folder never holds contact details and never replaces a file you changed (the new PDF gets the next free name, ...-2.pdf): markdown whose printed text has an email, a phone number or a profile link is refused there (contact_data_found) and needs --out FILE. --header FILE (with --out) fills the header from the person's own JSON file: {name, email, phone, location, github, linkedin, website, links: [{label, url}], work_authorization}, every field optional but the name; without --header the default file ~/Documents/GigAI/header.json (a GigAI home other than ~/.gigai: <home>/header.json) is used when it exists and --out is given. The header is the name and ONE line: location | work_authorization (as written) | links | email | phone; a field left empty leaves no separator and a line too long for the page is set smaller before it wraps. github and linkedin take just your id (github.com/<id>, linkedin.com/in/<id>; a full address is read as the id), website a site address; a link prints without https:// or www. and is clickable (its target is the full URL), and a link named twice prints once. Without the work_authorization key it comes from the profile's sponsorship answer. GigAI only reads the file for this PDF: it is never copied into the store, a log or a model prompt, and a PDF with a header is written only to --out, never to the resumes folder. A missing or invalid file is one plain sentence (header_file_missing / header_file_invalid) that names a field and a rule, never a value. A value of the file that is empty or starts with REPLACE (a template placeholder) is skipped and never printed: header_note names the skipped fields; a file with no name yet, or with nothing but placeholders (header_file_placeholders), is refused with a plain sentence. --no-header makes the PDF without a header. An agent does not read or send that file: it makes the headerless PDF, or passes --out and lets the command read the file. To change two bullets and render: edit the two lines in the markdown file and run the first example; for a stored tailored resume, change the lines with PUT /api/tailored-resumes/lines (use: custom) and run the --tailored example. --job-url URL alone renders the job's stored resume: --tailored is the older spelling of the same and stays accepted."
