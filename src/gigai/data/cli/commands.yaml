{
  "schemaVersion": 1,
  "commands": {
    "application history": {
      "summary": "List the recorded application history for one Gig, optionally for one opportunity.",
      "effect": "read",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai application history --gig scout --opportunity opp-1"
      ]
    },
    "application record": {
      "summary": "Record an application outcome from an explicit input file (needs --confirm).",
      "effect": "write",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai application record --gig scout --input outcome.json --confirm"
      ],
      "notes": "Write requires direct operator --confirm."
    },
    "application status": {
      "summary": "Show the current application state for one Gig, optionally for one opportunity.",
      "effect": "read",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai application status --gig scout"
      ]
    },
    "approve": {
      "summary": "Seal one pending proposal as an offline approved Gig version.",
      "effect": "write",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai approve prop-1"
      ],
      "notes": "Approval is offline; no model is called."
    },
    "capability prepare-successor": {
      "summary": "Prepare a pending successor proposal from one committed passed capability review. Never approves, activates or invokes.",
      "effect": "write",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai capability prepare-successor --gig scout --base-version 1 --base-proposal-id prop-1 --capability-id write_workpad --reviewed-manifest-id man-1 --operation-key op-1"
      ]
    },
    "capability review": {
      "summary": "Record reviewer judgment for the write_workpad capability from an input file (needs --confirm).",
      "effect": "write",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai capability review --gig scout --base-version 1 --base-proposal-id prop-1 --manifest-id man-1 --capability-id write_workpad --operation-key op-1 --input review.json --confirm"
      ]
    },
    "catalog inspect": {
      "summary": "Show one bundled catalog entry.",
      "effect": "read",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai catalog inspect scout"
      ]
    },
    "catalog install": {
      "summary": "Install a bundled catalog entry into the target project.",
      "effect": "write",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai catalog install scout --target ."
      ]
    },
    "catalog list": {
      "summary": "List the bundled catalog entries.",
      "effect": "read",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai catalog list"
      ]
    },
    "catalog validate": {
      "summary": "Validate one bundled catalog entry.",
      "effect": "read",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai catalog validate scout"
      ]
    },
    "check": {
      "summary": "Validate one existing proposal workpad without creating or changing it.",
      "effect": "read",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai check scout"
      ]
    },
    "comparison resume": {
      "summary": "Resume an interrupted comparison without rerunning terminal cases.",
      "effect": "write",
      "external": "model",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai comparison resume cmp-1 --gig scout --local-target ollama-local --luna-target codex --confirm"
      ],
      "notes": "Calls the two named model targets; needs --confirm."
    },
    "comparison run": {
      "summary": "Run the same frozen synthetic cases through two named model setups (local and Luna).",
      "effect": "write",
      "external": "model",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai comparison run --gig scout --local-target ollama-local --luna-target codex --confirm"
      ],
      "notes": "Calls the two named model targets; needs --confirm. `comparison start` is the same command."
    },
    "comparison show": {
      "summary": "Read one journal-authenticated comparison without rerunning it.",
      "effect": "read",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai comparison show cmp-1 --gig scout"
      ]
    },
    "comparison start": {
      "summary": "Alias of `comparison run`.",
      "effect": "write",
      "external": "model",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai comparison start --gig scout --local-target ollama-local --luna-target codex --confirm"
      ],
      "aliasOf": "comparison run"
    },
    "comparison status": {
      "summary": "Read authenticated attempt and per-case checkpoint status of a comparison.",
      "effect": "read",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai comparison status cmp-1 --gig scout"
      ]
    },
    "create": {
      "summary": "Create a proposal from an explicit agent invocation envelope (command=create).",
      "effect": "write",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai create scout --invocation create.json"
      ],
      "notes": "Requires --invocation; ordinary conversation is not imported. Refreshes the local runtime discovery snapshot; no model call."
    },
    "doctor": {
      "summary": "Run offline, zero-token installation and configured-mount checks.",
      "effect": "read",
      "external": "model",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai doctor --json"
      ],
      "notes": "Default is offline and zero-token. --live with --model-target makes one budget-bounded provider call (external=model)."
    },
    "external cancel": {
      "summary": "Record cancellation of an externally performed invocation under an approved Gig.",
      "effect": "write",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai external cancel --gig scout --stdin"
      ],
      "notes": "No provider runs; protocol for agents that perform the work themselves."
    },
    "external checkpoint": {
      "summary": "Record an external checkpoint under an approved Gig.",
      "effect": "write",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai external checkpoint --gig scout --stdin"
      ],
      "notes": "No provider runs."
    },
    "external graphs": {
      "summary": "List the approved Graphs an external agent may work under.",
      "effect": "read",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai external graphs --gig scout"
      ]
    },
    "external inspect": {
      "summary": "Inspect the state of an external run (or the Gig).",
      "effect": "read",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai external inspect --gig scout"
      ]
    },
    "external plan": {
      "summary": "Record an external plan under an approved Gig.",
      "effect": "write",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai external plan --gig scout --stdin"
      ],
      "notes": "No provider runs."
    },
    "external requirements": {
      "summary": "Show the requirements of one approved Graph for external work.",
      "effect": "read",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai external requirements --gig scout --graph tailor-application"
      ]
    },
    "external start": {
      "summary": "Start recording an externally performed run under an approved Gig.",
      "effect": "write",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai external start --gig scout --stdin"
      ],
      "notes": "No provider runs."
    },
    "external submit": {
      "summary": "Submit the result of an externally performed run under an approved Gig.",
      "effect": "write",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai external submit --gig scout --stdin"
      ],
      "notes": "No provider runs."
    },
    "feedback": {
      "summary": "Record verbatim operator feedback for one pending proposal.",
      "effect": "write",
      "external": "none",
      "output": "Human-readable text.",
      "examples": [
        "gigai feedback prop-1 --text \"Make the summary shorter\""
      ]
    },
    "gig use": {
      "summary": "Make one already-installed, approved Gig the active Gig for this project.",
      "effect": "write",
      "external": "none",
      "output": "Human-readable text; --json emits one JSON object.",
      "examples": [
        "gigai gig use scout"
