rank = 2
rank_source = "https://www.anthropic.com/pricing (model \"haiku\" is a claude CLI alias that floats to the newest Haiku; it named Claude Haiku 4.5 on rank_date)"
rank_date = "2026-11-09"
knobs = []
no_knobs = "the claude CLI takes no temperature or seed"

