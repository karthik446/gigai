# Items per set in each tier. `gate` is the per-release tier (560 calls a rung).
[tiers.gate]
contractnli = 60
ragtruth = 100
quality = 100
ifeval = 100
jsonschemabench = 100
rewardbench2 = 100

[tiers.judge]
judgebench = 100
mtbench_human = 150

[tiers.full]
contractnli = 60
ragtruth = 100
quality = 100
ifeval = 100
jsonschemabench = 100
rewardbench2 = 100
judgebench = 100
mtbench_human = 150
injection_composite = 200

# Tokens per call (prompt in, completion out) used by --plan's dollars. `k_score` is the set's K-score
# (the capability-map criteria: 0 = measures the gig's own skill, higher = further from it).
[sets.contractnli]
tokens_in = 29232
tokens_out = 5607
k_score = 0

[sets.ragtruth]
tokens_in = 29232
tokens_out = 5607
k_score = 0

[sets.quality]
tokens_in = 29232
tokens_out = 5607
k_score = 0

[sets.ifeval]
tokens_in = 1508
tokens_out = 345
k_score = 0

[sets.jsonschemabench]
tokens_in = 1508
tokens_out = 345
k_score = 0

[sets.rewardbench2]
tokens_in = 1508
tokens_out = 345
k_score = 1

[sets.judgebench]
tokens_in = 3000
tokens_out = 1500
k_score = 1

[sets.mtbench_human]
tokens_in = 3000
tokens_out = 1500
k_score = 0

[sets.injection_composite]
tokens_in = 3000
tokens_out = 1500
k_score = 2

# Gate b: the noise rung's main answers are repeat 0; it re-answers min(items, n) of them k - 1 more times.
[noise]
rung = "claude-haiku"
items = 100
k = 3
max_sd_points = 2.0
max_flip_rate = 0.10

# Gate a: Kendall tau-b between the measured and the published order.
[order]
min_tau = 0.6
min_rungs = 3
saturated_at = 0.97

# Gate c: each canary sabotages the suite on purpose; the suite score must drop by at least `min_drop` points,
# with an exact McNemar p below `max_p`.
[canaries]
rung = "gemini-flash-lite"
max_p = 0.01

[canaries.broken_prompt]
sets = ["ifeval", "quality"]
items = 100
min_drop = 10.0

[canaries.truncated_context]
sets = ["quality", "ragtruth", "contractnli"]
min_drop = 15.0
keep = 0.25
items = 100

[canaries.wrong_label]
sets = ["quality", "ragtruth", "contractnli"]
min_drop = 30.0

# Gate e: a replay of one run re-scores its stored traces with no call.
[replay]
max_abs_delta = 0.0005
