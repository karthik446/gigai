# Test-only gig (P4s store tests): declares one SQLite store under [data] stores and opens it. Never published.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gigai-test-gig-storegig"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["click>=8"]

[project.entry-points."gigai.gigs"]
storegig = "gig_storegig:storegig"

[tool.hatch.build.targets.wheel]
packages = ["gig_storegig"]
