[gig]
manifest_format = 1
name = "eval-fixture"
description = "Test-only gig: answers synthetic questions and traces each call to evals.sqlite"
core = ">=0.2.0a2"

[commands]
group = "gig_eval_fixture:eval_fixture"
provides = ["answer", "replay", "note", "ask"]

[[data.stores]]
name = "notes"
engine = "sqlite"

# BK2: `ctx.model(step)` binds each step to a config.toml model target; the deterministic targets
# answer from responses.json["<target id>"].
[steps.answer]
prompt = "prompts/answer.txt"
target = "deterministic-a"

[steps.judge]
prompt = "prompts/judge.txt"
target = "deterministic-b"
settings = { temperature = 0.0 }

[steps.solve]
prompt = "prompts/solve.txt"
target = "deterministic-a"

[evals]
cluster = "fixture"

[[evals.steps]]
id = "answer"
model_target = "offline-default"
prompt = { id = "answer", version = "1", file = "prompts/answer.txt" }
postprocess = "gig_eval_fixture:postprocess"
scorers = ["gig_eval_fixture.scorers:exact_match", "step:judge"]
datasets.ci = { path = "dataset.jsonl", source = "synthetic (written for the gigai test suite)", licence = "CC0-1.0", sha256 = "1900380cb28eab5800ad3d25fa3d08fe6e8284a6f7d67536c0fbb094d66cc655" }
datasets.release = { path = "{data}/datasets/answer-release.jsonl", source = "the operator's own questions", licence = "private", sha256 = "3c1e5a7b9d0f2a4c6e8b0d1f3a5c7e9b1d3f5a7c9e0b2d4f6a8c0e1b3d5f7a9c" }
gates.ci = { suite = "ci", max_calls = 0, primary = { metric = "exact_match", min_ci_lower = 0.5 }, snapshot = "snapshots/answer-ci.json" }

[[evals.steps]]
id = "judge"
model_target = "offline-default"
prompt = { id = "judge", version = "1", file = "prompts/judge.txt" }
grades = "answer"
dimension = "correctness"
validation = { against = "dataset.jsonl", min_n = 3, min_kappa = 0.6, report = ["tpr", "tnr", "kappa"] }

# `eval run --step solve --suite ci`: the committed 10-item tinyGSM8k ci slice, answered from responses.json with
# the canned completions of the evals re-spike's scoring check (every 10th source row wrong).
[[evals.steps]]
id = "solve"
model_target = "offline-default"
prompt = { id = "solve", version = "1", file = "prompts/solve.txt" }
postprocess = "gig_eval_fixture.scorers:final_number"
scorers = ["gigai.evals.contracts:match", "gig_eval_fixture.scorers:answer_marker"]
datasets.ci = { path = "tinygsm8k.jsonl", source = "tinyBenchmarks/tinyGSM8k @ b870449ed96ee3e308748b550908332450ec4098 (ci slice of 10 rows)", licence = "MIT", sha256 = "d75f87e7d63bfcff9c5db621a4d67a751b2d652e778b2fa28c0554d20b6bc81d" }
# `eval run --step solve --suite release|upgrade` answers the 12 synthetic rows (10 clusters, slices easy/hard, tag
# core) offline from responses.json; the gates name the step's scorers by metric (match, answer_marker).
datasets.release = { path = "release.jsonl", source = "synthetic (written for the gigai test suite)", licence = "CC0-1.0", sha256 = "b0a23ac9b8057a03bfee67687978cf4f9a0891990bb86a09ffea5b5042298443" }
datasets.upgrade = { path = "release.jsonl", source = "synthetic (written for the gigai test suite)", licence = "CC0-1.0", sha256 = "b0a23ac9b8057a03bfee67687978cf4f9a0891990bb86a09ffea5b5042298443" }
gates.release = { suite = "release", k = 1, paired_to = "last-release", slices = ["easy", "hard", "core"], primary = { metric = "match", min_ci_lower = -0.25 }, guard = { metric = "answer_marker", no_worse = -0.10 } }
gates.upgrade = { suite = "upgrade", k = 2, paired_to = "previous-model", primary = { metric = "match", no_worse = -0.05 } }
