# Test-only gig (P5a process supervisor tests): declares [server] mode = "process"; its server is gig_demo/server.py.
# Never published. Build A -> B without reinstalling: rewrite `Version:` in the installed .dist-info/METADATA.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gigai-test-gig-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["click>=8"]

[project.entry-points."gigai.gigs"]
demo = "gig_demo:demo"

[tool.hatch.build.targets.wheel]
packages = ["gig_demo"]
